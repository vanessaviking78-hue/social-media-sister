const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');

/* ---------- data layer: same calls for demo mode and Supabase ---------- */
const EBOOK=[["A note before we begin", "", "<p>If you're reading this because you're pregnant, have recently had a baby, or are wondering how on earth you're going to manage everything, I want you to take a breath.<\/p><p>You don't have to know everything today.<\/p><p>You don't have to have the perfect nursery, the perfect relationship, a huge bank balance or a five-year plan.<\/p><p>You don't even have to feel excited every minute.<\/p><p>You might be frightened. You might be confused. You might be happy one minute and crying the next. You might be worrying about what your parents will say, what your friends will think or whether the person who helped create this baby will stick around.<\/p><p>All of those feelings deserve space.<\/p><p>Being a young mum can bring challenges, but it can also bring enormous love, purpose, confidence and opportunities to discover just how capable you are.<\/p><p>This book isn't here to tell you what kind of mother you should be. It's here to help you understand what's coming, where to find help and how to make decisions that are right for you and your baby.<\/p><p>There is no prize for doing everything alone.<\/p><p>And please remember this: <b>You are allowed to be a young woman and a mother at the same time.<\/b><\/p><p>Let's start.<\/p>"], ["Chapter 1", "The two pink lines", "<p>Finding out you're pregnant can be one of the most overwhelming moments of your life.<\/p><p>Perhaps you suspected it. Perhaps your period was late. Perhaps you took a test on a whim and suddenly found yourself staring at two lines.<\/p><p>Whatever happened, you may have experienced a hundred different emotions in the space of five minutes.<\/p><p>Excitement. Fear. Shock. Disbelief. Panic.<\/p><p>You might even have felt nothing at all.<\/p><p>There is no correct reaction.<\/p><h4>First things first<\/h4><p>If you've taken a positive pregnancy test, arrange pregnancy care through your NHS maternity service.<\/p><p>In England, you can usually refer yourself directly to maternity services without needing to visit your GP first. Try to arrange this as early as possible.<\/p><p>Your midwife will explain what happens next, arrange appointments and answer questions.<\/p><p>If you're worried about confidentiality, tell the healthcare professional. Ask them to explain who can see your information and what circumstances might require them to share it.<\/p><p>If you're under 16, you can still ask for confidential sexual and reproductive healthcare. Professionals will consider your safety and welfare, so don't let uncertainty about confidentiality stop you asking for help.<\/p><h4>You don't have to make every decision today<\/h4><p>You may be thinking about:<\/p><ul><li>Whether you want to continue the pregnancy.<\/li><li>Whether you have support from your family.<\/li><li>Whether the baby's father will be involved.<\/li><li>Where you will live.<\/li><li>How you will afford everything.<\/li><li>Whether you will continue your education.<\/li><\/ul><p>These are important questions, but you can work through them with appropriate support.<\/p><p>You deserve non-judgemental information about all your options.<\/p><h4>Your first little checklist<\/h4><ul><li>Arrange pregnancy care.<\/li><li>Speak to someone you trust.<\/li><li>Write down the questions running around your head.<\/li><li>Ask about financial and practical support.<\/li><li>Don't rely on social media for medical advice.<\/li><\/ul><p>And one more thing: don't spend the evening searching every possible pregnancy complication on the internet. You will find enough to frighten yourself without any assistance.<\/p><p>Ask your midwife instead.<\/p>"], ["Chapter 2", "Am I going to be a good mum?", "<p>Let's deal with one of the biggest worries first.<\/p><p>You do not have to be a perfect mother.<\/p><p>You don't need to instinctively know how to change a nappy, understand every cry or know what every piece of baby equipment does.<\/p><p>Nobody arrives in the delivery room with a parenting qualification.<\/p><p>Parenthood is learned.<\/p><p>You will make mistakes. You will have days when you feel completely out of your depth. You will probably question yourself more times than you can count.<\/p><p>That doesn't mean you're failing.<\/p><h4>What makes a good mum?<\/h4><p>A good mum is someone who:<\/p><ul><li>Tries to understand what her baby needs.<\/li><li>Keeps her baby safe.<\/li><li>Asks for help when she needs it.<\/li><li>Learns from mistakes.<\/li><li>Shows affection and responds to her baby's needs.<\/li><li>Looks after her own wellbeing too.<\/li><\/ul><p>Notice something?<\/p><p>None of those things require you to be 25, married, wealthy or living in a beautiful house.<\/p><p>Your age does not automatically determine your ability to love and care for a child.<\/p><h4>Stop comparing yourself<\/h4><p>Social media can make motherhood look like a permanent collection of beautifully dressed babies, immaculate homes and smiling mothers.<\/p><p>Real motherhood also includes:<\/p><ul><li>Washing the same three baby grows repeatedly.<\/li><li>Eating toast over the kitchen sink.<\/li><li>Wondering why the baby has been crying for 40 minutes.<\/li><li>Wearing yesterday's clothes.<\/li><li>Being delighted when someone brings you a cup of tea.<\/li><\/ul><p>You are seeing carefully selected moments online, not the entire story.<\/p><p>Your baby needs a safe, loving and responsive parent. Your baby does not need an Instagram-worthy childhood.<\/p>"], ["Chapter 3", "Telling your family and friends", "<p>For some young mothers, this is harder than anything else.<\/p><p>You may be frightened of disappointing your parents. You may worry about losing friendships or being treated differently at school.<\/p><p>You cannot control everybody's reaction.<\/p><p>Some people will surprise you with their kindness. Others may need time to process the news.<\/p><h4>If you're frightened of telling your parents<\/h4><p>Choose a time when you can talk without rushing.<\/p><p>You might say:<\/p><p>\"I need to tell you something important. I'm pregnant. I know this might be difficult to hear, and I'm frightened about your reaction too. I don't have all the answers yet, but I really need your support while I work things out.\"<\/p><p>If speaking feels impossible, write it down.<\/p><p>You could also ask a trusted adult, midwife or support worker to help you have the conversation.<\/p><p>If you think telling somebody could put you in danger, speak privately to a healthcare professional or safeguarding worker first.<\/p><h4>What about your friends?<\/h4><p>Some friendships will remain exactly as they were.<\/p><p>Others may change.<\/p><p>Your friends may still be interested in parties, college, relationships and late nights. You may find yourself thinking about feeding times, appointments and baby clothes.<\/p><p>It doesn't mean you're better or worse than them. You're simply experiencing a different stage of life.<\/p><p>Try to keep friendships that make you feel supported rather than judged.<\/p><p>And remember, you can still laugh, go out, enjoy yourself and have fun. Motherhood is a huge part of your life, but it doesn't have to become your entire personality.<\/p>"], ["Chapter 4", "Pregnancy without the panic", "<p>Pregnancy is a journey, and knowing roughly what to expect can make it feel less frightening.<\/p><p>Every pregnancy is different, so your experience may not follow a textbook.<\/p><h4>The first trimester: weeks 1 to 12<\/h4><p>You might experience:<\/p><ul><li>Nausea or sickness.<\/li><li>Extreme tiredness.<\/li><li>Tender breasts.<\/li><li>Changes in appetite.<\/li><li>Emotional ups and downs.<\/li><li>Needing the toilet more frequently.<\/li><\/ul><p>You may not look pregnant yet, but your body is going through significant changes.<\/p><p>Arrange your antenatal appointments and ask your midwife about supplements, nutrition, medication and anything you're worried about.<\/p><h4>The second trimester: weeks 13 to 27<\/h4><p>Many women begin to feel more comfortable during this stage, although not everybody does.<\/p><p>You may:<\/p><ul><li>Start showing.<\/li><li>Feel your baby move.<\/li><li>Have your 20-week screening scan.<\/li><li>Experience backache or stretching sensations.<\/li><li>Start thinking more seriously about birth and practical preparations.<\/li><\/ul><p>Feeling your baby move can be a very special experience.<\/p><p>Your midwife will explain what normal movement patterns mean and what to do if movements change or reduce.<\/p><h4>The third trimester: weeks 28 to birth<\/h4><p>Your baby is growing, and you may be feeling increasingly uncomfortable.<\/p><p>Common experiences include:<\/p><ul><li>Trouble sleeping.<\/li><li>Backache.<\/li><li>Heartburn.<\/li><li>Swollen ankles.<\/li><li>Braxton Hicks contractions.<\/li><li>More frequent trips to the toilet.<\/li><\/ul><p>Start preparing your hospital bag, discuss your birth preferences and attend any antenatal classes available to you.<\/p><h4>When should you seek medical help?<\/h4><p>Never feel embarrassed about contacting your maternity unit if something doesn't feel right.<\/p><p>Seek urgent advice for concerns such as vaginal bleeding, severe abdominal pain, severe headache, visual disturbances or reduced baby movements.<\/p><p>If you have an immediate medical emergency, call 999.<\/p><p>You are not being dramatic by asking for help.<\/p>"], ["Chapter 5", "Birth: what actually happens?", "<p>If you're frightened about giving birth, you're certainly not alone.<\/p><p>You may have watched dramatic birth scenes on television or listened to friends describing their experiences.<\/p><p>Remember that those stories are not a prediction of your own birth.<\/p><p>There are different ways to give birth, and your maternity team will help you understand your options.<\/p><h4>Vaginal birth<\/h4><p>This is when your baby is born through the vagina.<\/p><p>Labour generally involves:<\/p><ol><li>Contractions that help your cervix open.<\/li><li>The cervix becoming fully dilated.<\/li><li>The pushing stage.<\/li><li>Your baby being born.<\/li><li>Delivery of the placenta.<\/li><\/ol><p>Your midwife will support you throughout labour and explain what's happening.<\/p><h4>Caesarean birth<\/h4><p>A caesarean is an operation in which your baby is delivered through an incision in your abdomen and womb.<\/p><p>Some caesareans are planned, while others become necessary during labour.<\/p><p>You may have a spinal anaesthetic, which means you are awake but should not feel pain during the operation.<\/p><h4>Pain relief<\/h4><p>You have options, including:<\/p><ul><li>Breathing and relaxation techniques.<\/li><li>Gas and air.<\/li><li>Opioid pain relief where appropriate.<\/li><li>An epidural.<\/li><\/ul><p>Ask your midwife to explain the advantages and limitations of each option.<\/p><h4>Your birth preferences<\/h4><p>You can write down what matters to you.<\/p><p>For example:<\/p><ul><li>Who you would like with you.<\/li><li>Whether you want explanations before procedures.<\/li><li>Your preferences for pain relief.<\/li><li>Skin-to-skin contact after birth.<\/li><li>Your feeding preferences.<\/li><\/ul><p>These are preferences, not guarantees. Your safety and your baby's safety always come first.<\/p><h4>One thing worth remembering<\/h4><p>There is no medal for having a particular type of birth.<\/p><p>A vaginal birth, an assisted birth or a caesarean birth does not make you more or less of a mother.<\/p><p>You have brought a baby into the world. That is enough.<\/p>"], ["Chapter 6", "Bringing your baby home", "<p>This is where things can suddenly feel very real.<\/p><p>You've spent months thinking about your baby, and now there is a tiny person who relies on you for absolutely everything.<\/p><p>You may feel confident one minute and completely overwhelmed the next.<\/p><p>That's normal.<\/p><h4>The first few days<\/h4><p>You will be learning:<\/p><ul><li>How to change nappies.<\/li><li>How to feed your baby.<\/li><li>How to dress and bathe your baby.<\/li><li>How to recognise when your baby is tired.<\/li><li>How to comfort your baby.<\/li><li>How to handle your own recovery.<\/li><\/ul><p>Your midwife and health visitor are there to help.<\/p><p>You do not have to pretend you know everything.<\/p><h4>Feeding your baby<\/h4><p>There are different ways to feed a baby.<\/p><p>Breastfeeding can take time to establish, and support is available if you're finding it difficult.<\/p><p>Formula feeding is also a way to nourish your baby safely when prepared according to the instructions.<\/p><p>Your midwife or health visitor can help you understand feeding quantities, preparation, positioning and signs that your baby is feeding well.<\/p><p>Never feel that you have to hide feeding difficulties.<\/p><h4>Nappies<\/h4><p>Newborn babies need frequent nappy changes.<\/p><p>You will quickly become familiar with:<\/p><ul><li>Wet nappies.<\/li><li>Dirty nappies.<\/li><li>Nappy rash.<\/li><li>Different poo colours and textures.<\/li><\/ul><p>Your midwife can explain what is normal and what requires medical attention.<\/p><h4>Safe sleeping<\/h4><p>This is particularly important.<\/p><p>The NHS recommends that babies:<\/p><ul><li>Sleep on their backs.<\/li><li>Sleep in their own clear, flat, separate sleep space.<\/li><li>Have their sleep space in the same room as you for at least the first six months.<\/li><li>Are kept at a comfortable temperature.<\/li><li>Are not exposed to pillows, loose bedding or soft toys in their sleep space.<\/li><\/ul><p>Never fall asleep with your baby on a sofa or armchair.<\/p><p>Ask your midwife about safe sleep arrangements and what to do if you're extremely tired.<\/p><h4>What if my baby cries constantly?<\/h4><p>Babies cry. It is how they communicate.<\/p><p>They may be hungry, uncomfortable, tired, overstimulated or simply need reassurance.<\/p><p>Try:<\/p><ul><li>Checking their nappy.<\/li><li>Offering a feed if appropriate.<\/li><li>Holding and gently comforting them.<\/li><li>Talking or singing softly.<\/li><li>Checking whether they're too hot or cold.<\/li><\/ul><p>If you feel overwhelmed, put your baby safely in their cot and take a few minutes to calm yourself.<\/p><p>Never shake a baby.<\/p><p>If crying is unusual, persistent or accompanied by signs of illness, seek medical advice.<\/p>"], ["Chapter 7", "The things nobody tells you", "<p>Let's talk about the realities of motherhood.<\/p><p>Not to frighten you, but because knowing what to expect can make a huge difference.<\/p><h4>You will probably be tired<\/h4><p>Newborn babies do not understand the concept of a good night's sleep.<\/p><p>They wake for feeds, need changing and sometimes want comfort.<\/p><p>You may feel as though you've barely closed your eyes.<\/p><p>Accept practical help where possible. If somebody offers to cook, shop or sit with the baby while you rest, consider accepting.<\/p><p>The washing can wait.<\/p><h4>You might cry<\/h4><p>Hormonal changes, physical recovery, exhaustion and the enormous adjustment to parenthood can all affect your emotions.<\/p><p>Some women experience the baby blues during the first days after birth. These feelings usually settle within two weeks.<\/p><p>If sadness, anxiety or hopelessness continues, gets worse or affects your ability to cope, speak to your GP, midwife or health visitor.<\/p><p>Postnatal depression is treatable. It is not a character flaw or a sign that you don't love your baby.<\/p><h4>You might not feel an instant bond<\/h4><p>This is something many women worry about.<\/p><p>Some mothers feel an immediate connection. Others need time.<\/p><p>You may be recovering from birth, exhausted, overwhelmed or struggling with feeding.<\/p><p>Bonding can develop gradually through ordinary moments: holding your baby, talking to them, feeding them and responding to their needs.<\/p><p>Ask for support if you're worried.<\/p><h4>Your body needs recovery time<\/h4><p>Your body has been through a significant physical event.<\/p><p>You may experience bleeding, soreness, stitches, breast changes and emotional fluctuations.<\/p><p>Follow the recovery advice from your maternity team and attend your postnatal appointments.<\/p><p>You do not need to rush back into exercise, dieting or trying to look like you did before pregnancy.<\/p><p>You have time.<\/p>"], ["Chapter 8", "Doing it alone: single motherhood", "<p>Perhaps the baby's father is involved.<\/p><p>Perhaps he isn't.<\/p><p>Perhaps you are together but the relationship is complicated.<\/p><p>Whatever your circumstances, you deserve support.<\/p><p>Being a single mother doesn't mean you have to do everything without help.<\/p><h4>If the father isn't involved<\/h4><p>This can be painful.<\/p><p>You might feel angry, disappointed, rejected or frightened about managing alone.<\/p><p>You may also worry about what your child will think as they grow older.<\/p><p>You don't need to solve every future question today.<\/p><p>Focus on creating a safe, stable environment for your baby.<\/p><p>If the father wants to be involved, arrangements should prioritise the child's welfare and safety.<\/p><p>If there are concerns about abuse, intimidation or coercion, seek specialist support before making contact arrangements.<\/p><h4>Build your support network<\/h4><p>Think about the people who could help you.<\/p><p>It might be:<\/p><ul><li>Your mum or dad.<\/li><li>A sister or brother.<\/li><li>A trusted friend.<\/li><li>A neighbour.<\/li><li>A health visitor.<\/li><li>A family support worker.<\/li><li>A local young parents' group.<\/li><\/ul><p>You don't need 20 people.<\/p><p>One or two dependable people can make an enormous difference.<\/p><h4>You are allowed to have boundaries<\/h4><p>Being grateful for help doesn't mean allowing people to control your parenting.<\/p><p>You can politely say:<\/p><p>\"Thank you for helping me. I really appreciate it, but I'd like to do this in my own way.\"<\/p><p>You are learning. You deserve room to grow.<\/p>"], ["Chapter 9", "Money, housing and getting organised", "<p>Money can be one of the biggest worries for young mothers.<\/p><p>You may be studying, unemployed or living with your parents.<\/p><p>You may have no idea how you'll afford nappies, clothes, food and everything else a baby needs.<\/p><p>The important thing is to find out what support you're entitled to.<\/p><h4>Benefits and financial support<\/h4><p>Depending on your circumstances, you may be eligible for:<\/p><ul><li>Universal Credit.<\/li><li>Child Benefit.<\/li><li>Healthy Start, if eligible.<\/li><li>Help with NHS health costs.<\/li><li>Housing support.<\/li><li>Council Tax support.<\/li><li>Other local authority assistance.<\/li><\/ul><p>Eligibility depends on your age, income, living arrangements and individual circumstances.<\/p><p>If you're under 18, some benefit rules are different. Do not assume you are ineligible. Ask for specialist advice.<\/p><h4>Where to get help<\/h4><p>Useful places to start include:<\/p><ul><li>Citizens Advice.<\/li><li>Your local council.<\/li><li>Jobcentre Plus.<\/li><li>Your midwife or family support worker.<\/li><li>Gingerbread, which supports single-parent families.<\/li><\/ul><p>Ask someone to help you check your entitlements if the system feels confusing.<\/p><h4>Baby budgeting<\/h4><p>You do not need to spend hundreds of pounds preparing for a baby.<\/p><p>Start with the essentials.<\/p><p><b>Sleeping<\/b><\/p><ul><li>A safe cot or crib.<\/li><li>A suitable firm, flat mattress.<\/li><li>Appropriate bedding or a baby sleeping bag.<\/li><\/ul><p><b>Clothing<\/b><\/p><ul><li>Vests.<\/li><li>Sleepsuits.<\/li><li>A few cardigans.<\/li><li>Weather-appropriate outerwear.<\/li><\/ul><p><b>Changing<\/b><\/p><ul><li>Nappies.<\/li><li>Cotton wool or suitable wipes.<\/li><li>Changing mat.<\/li><li>Nappy bags.<\/li><\/ul><p><b>Feeding<\/b><\/p><ul><li>Breastfeeding supplies if wanted and needed.<\/li><li>Bottles and formula if formula feeding.<\/li><\/ul><p><b>Travelling<\/b><\/p><ul><li>A suitable car seat if travelling by car.<\/li><li>A pram or pushchair that meets safety requirements.<\/li><\/ul><p>You can often find good-quality second-hand clothing and equipment, but be particularly careful with safety-critical items such as car seats, mattresses and cots.<\/p><h4>A little financial exercise<\/h4><p>Write down:<\/p><ol><li>Money coming into your household.<\/li><li>Rent or household contributions.<\/li><li>Food and essential bills.<\/li><li>Baby expenses.<\/li><li>Transport costs.<\/li><li>Any debts or repayments.<\/li><\/ol><p>Then identify what support you might be missing.<\/p><p>You don't have to become a financial expert overnight. You just need a starting point.<\/p>"], ["Chapter 10", "School, college, work and your future", "<p>One of the biggest myths surrounding teenage motherhood is that your future has to stop.<\/p><p>It doesn't.<\/p><p>Your route might look different from the one you originally imagined, but you can still study, gain qualifications, work, build a career and pursue ambitions.<\/p><h4>Can I continue my education?<\/h4><p>Yes. Speak to your school, college or education provider about your circumstances.<\/p><p>Ask about:<\/p><ul><li>Flexible attendance.<\/li><li>Study arrangements.<\/li><li>Financial support.<\/li><li>Childcare options.<\/li><li>Pregnancy-related adjustments.<\/li><li>Returning to education after maternity leave.<\/li><\/ul><p>You deserve to understand your options before making decisions about leaving education.<\/p><h4>What about childcare?<\/h4><p>Your local authority can help you understand available childcare support.<\/p><p>Depending on your age and circumstances, there may be funded childcare or other financial assistance.<\/p><p>Family Hubs can also provide information about parenting support, health visiting and feeding advice.<\/p><h4>Don't abandon your ambitions<\/h4><p>Perhaps you wanted to become a nurse, hairdresser, teacher, business owner or something completely different.<\/p><p>Keep that ambition somewhere you can see it.<\/p><p>You may need to adapt the timeline.<\/p><p>You may need additional support.<\/p><p>But becoming a mother doesn't mean you have stopped being a person with potential.<\/p><p>Your future is still yours to build.<\/p>"], ["Chapter 11", "When motherhood feels overwhelming", "<p>This chapter matters enormously.<\/p><p>There is a difference between having a difficult day and struggling with your mental health.<\/p><p>You may feel lonely, frightened, anxious or constantly exhausted.<\/p><p>You may wonder whether you're doing enough.<\/p><p>You may feel guilty for wanting a break.<\/p><p>Please don't ignore those feelings.<\/p><h4>Signs that you need additional support<\/h4><p>Speak to your GP, midwife or health visitor if you experience:<\/p><ul><li>Persistent sadness.<\/li><li>Feeling hopeless.<\/li><li>Constant anxiety.<\/li><li>Difficulty sleeping even when you have the opportunity.<\/li><li>Feeling unable to cope.<\/li><li>Losing interest in things you previously enjoyed.<\/li><li>Difficulty bonding with your baby.<\/li><li>Feelings of worthlessness or guilt.<\/li><\/ul><p>Postnatal depression can affect mothers of any age.<\/p><p>It can be treated, and asking for help is an act of care for both you and your baby.<\/p><p>If you experience thoughts of harming yourself or your baby, seek urgent professional help. If there is immediate danger, call 999.<\/p><p>Sudden severe confusion, hallucinations or extreme changes in behaviour after birth also require urgent medical assessment.<\/p><h4>You are allowed to ask for a break<\/h4><p>You can love your baby and still need time away from the demands of caring.<\/p><p>You can be grateful for your child and still miss your old life sometimes.<\/p><p>Those feelings can exist together.<\/p><p>Try to:<\/p><ul><li>Speak to someone you trust.<\/li><li>Get outside when possible.<\/li><li>Eat regular meals.<\/li><li>Rest whenever you can.<\/li><li>Accept practical help.<\/li><li>Keep your health appointments.<\/li><\/ul><p>You matter too.<\/p>"], ["Chapter 12", "You are still you", "<p>Somewhere between pregnancy appointments, feeds, nappies and sleepless nights, you might start to feel as though you've disappeared.<\/p><p>You may feel that everyone now sees you as somebody's mum.<\/p><p>But you're still the same person.<\/p><p>You still deserve friendships, laughter, new experiences and opportunities.<\/p><p>You are allowed to enjoy being young.<\/p><p>You can have a favourite singer, watch terrible television, go shopping, study, have a hobby and make plans for the future.<\/p><p>You don't need to become serious and sensible every minute of every day.<\/p><h4>Make time for yourself<\/h4><p>It might be 20 minutes with a cup of tea.<\/p><p>It might be a phone call with a friend.<\/p><p>It might be getting your hair done or going for a walk.<\/p><p>It doesn't have to be expensive or elaborate.<\/p><p>Looking after yourself is part of looking after your family.<\/p><h4>Your child doesn't need a perfect mother<\/h4><p>Your child needs a mother who is willing to learn, love, protect and grow.<\/p><p>You will change as your child grows.<\/p><p>You will discover strengths you didn't know you had.<\/p><p>You will have difficult days, but you will also experience moments that make everything feel worthwhile.<\/p><p>And one day, you may look back at the frightened young woman who opened this book and realise how much she has achieved.<\/p>"], ["Chapter 13", "Your practical survival guide", "<p>Here are some things you can return to whenever life feels overwhelming.<\/p><h4>Pregnancy checklist<\/h4><ul><li>[ ] Arrange your first midwife appointment.<\/li><li>[ ] Ask about supplements and pregnancy health.<\/li><li>[ ] Find out about available antenatal classes.<\/li><li>[ ] Discuss your birth preferences.<\/li><li>[ ] Check financial support.<\/li><li>[ ] Start thinking about safe sleeping arrangements.<\/li><li>[ ] Identify at least one person you can contact for help.<\/li><\/ul><h4>Before baby arrives<\/h4><ul><li>[ ] Prepare a hospital bag.<\/li><li>[ ] Arrange a safe sleeping space.<\/li><li>[ ] Wash newborn clothing.<\/li><li>[ ] Organise feeding supplies.<\/li><li>[ ] Arrange suitable transport.<\/li><li>[ ] Find out when your midwife and health visitor will visit.<\/li><li>[ ] Make a list of important telephone numbers.<\/li><\/ul><h4>Your first month<\/h4><ul><li>[ ] Attend postnatal appointments.<\/li><li>[ ] Register your baby's birth within the applicable legal timeframe.<\/li><li>[ ] Ask about registering your baby with a GP.<\/li><li>[ ] Check Child Benefit eligibility.<\/li><li>[ ] Ask about feeding support.<\/li><li>[ ] Learn the signs of illness in newborns.<\/li><li>[ ] Make time to check in with your own mental health.<\/li><\/ul><h4>Useful UK support services<\/h4><p><b>NHS<\/b><br>Pregnancy, birth, newborn care and mental health information.<\/p><p>www.nhs.uk<\/p><p><b>Family Nurse Partnership<\/b><br>An intensive home-visiting programme for eligible first-time young parents in participating areas of England.<\/p><p>www.gov.uk/guidance/family-nurse-partnership-programme<\/p><p><b>Gingerbread<\/b><br>Information, advice and support for single-parent families.<\/p><p>www.gingerbread.org.uk<\/p><p><b>Citizens Advice<\/b><br>Advice about benefits, housing, money and employment.<\/p><p>www.citizensadvice.org.uk<\/p><p><b>Childline<\/b><br>Free, confidential support for children and young people.<\/p><p>0800 1111<\/p><p>www.childline.org.uk<\/p><p><b>Samaritans<\/b><br>Someone to talk to when things feel unbearable.<\/p><p>116 123<\/p><p>www.samaritans.org<\/p><p><b>NHS 111<\/b><br>For urgent medical advice when it is not an emergency. Use 999 for emergencies.<\/p><p>For readers in Wales, Scotland and Northern Ireland, some maternity, benefits and family support arrangements differ. Check the relevant national NHS and government services.<\/p>"], ["A final letter to you", "", "<p>Dear young mum,<\/p><p>I wonder what brought you to this book.<\/p><p>Perhaps you're sitting in your bedroom wondering how your life is going to change.<\/p><p>Perhaps you've just brought your baby home and you're frightened that everyone else seems to know what they're doing.<\/p><p>Perhaps you're doing this without the support of the baby's father.<\/p><p>Or perhaps you have a wonderful family around you but still feel completely overwhelmed.<\/p><p>Whatever your circumstances, I want you to remember something.<\/p><p>You do not have to prove yourself to everybody.<\/p><p>You do not have to become a perfect mother to silence the people who doubted you.<\/p><p>You do not have to sacrifice every dream you ever had.<\/p><p>You are learning something new, and that takes time.<\/p><p>There will be mornings when you feel exhausted and evenings when you question whether you're doing enough.<\/p><p>There will also be little moments that stay with you forever.<\/p><p>A tiny hand wrapping around your finger.<\/p><p>Your baby's first smile.<\/p><p>The first time they recognise your voice.<\/p><p>The first time they look at you as though you are their entire world.<\/p><p>And perhaps, one day, you'll realise that the frightened girl who once wondered whether she could manage has become a woman who knows she can face far more than she ever imagined.<\/p><p>You are allowed to grow up alongside your child.<\/p><p>You are allowed to make mistakes.<\/p><p>You are allowed to ask for help.<\/p><p>You are allowed to have a future.<\/p><p>And above everything else, you deserve kindness, support and the opportunity to make your own choices.<\/p><p>Take it one day at a time.<\/p><p>You've got a lot to learn, but you don't have to learn it all today.<\/p><p><b>Your story is only just beginning.<\/b><\/p><p>With love,<\/p><p><i>The person who wants you to know that you are not alone.<\/i><\/p><h4>Important reading note<\/h4><p>This book is intended as general information and emotional support. It is not a substitute for individual medical, legal, safeguarding or financial advice. Pregnancy and newborn health concerns should always be discussed with qualified healthcare professionals. Government benefits, eligibility rules and support programmes can change, so check current official guidance before making decisions.<\/p>"]];
const TABLES=['food_entries','vitamin_items','sleep_entries','mood_entries','journal_entries','letters','baby_names','selfcare_items','shopping_items','bag_items','appointments','task_logs'];
let sb=null;
const DB={
  user:null,
  key(t){return 'hb:'+this.user.id+':'+t},
  async list(t){
    if(sb){const r=await sb.from(t).select('*').order('created_at',{ascending:true});return r.data||[]}
    try{return JSON.parse(ls.get(this.key(t))||'[]')}catch(e){return[]}
  },
  async add(t,row){
    if(sb){const r=await sb.from(t).insert(row).select().single();if(r.error)throw r.error;return r.data}
    const all=await this.list(t);const n={id:uid(),created_at:new Date().toISOString(),...row};all.push(n);ls.set(this.key(t),JSON.stringify(all));return n
  },
  async update(t,id,patch){
    if(sb){await sb.from(t).update(patch).eq('id',id);return}
    const all=(await this.list(t)).map(r=>r.id===id?{...r,...patch}:r);ls.set(this.key(t),JSON.stringify(all))
  },
  async remove(t,id){
    if(sb){await sb.from(t).delete().eq('id',id);return}
    const all=(await this.list(t)).filter(r=>r.id!==id);ls.set(this.key(t),JSON.stringify(all))
  },
  async getProfile(){
    if(sb){const r=await sb.from('profiles').select('*').maybeSingle();return r.data}
    try{return JSON.parse(ls.get(this.key('profile'))||'null')}catch(e){return null}
  },
  async saveProfile(p){
    if(sb){await sb.from('profiles').upsert({id:this.user.id,...p});return}
    ls.set(this.key('profile'),JSON.stringify(p))
  }
};

/* ---------- pregnancy maths (dates only, no medical claims) ---------- */
function preg(){
  const d=S.profile&&S.profile.due_date;if(!d)return null;
  const due=new Date(d+'T12:00'),now=new Date();
  const days=Math.floor((now-new Date(due.getTime()-280*864e5))/864e5);
  const left=Math.ceil((due-now)/864e5);
  return{wk:Math.floor(days/7),dd:days%7,left,pct:Math.max(0,Math.min(100,days/280*100)),days};
}
const tri=w=>w<14?'First trimester':w<28?'Second trimester':'Third trimester';

/* ---------- views ---------- */
function header(){return `<div class="top"><div class="brand">Hello Baby</div><div class="muted">${esc(fmtDate(today()))}</div></div>`}
function chips(group,opts){return `<div class="chips">`+opts.map(([k,l])=>`<button class="chip ${S.sub[group]===k?'on':''}" data-a="sub" data-g="${group}" data-k="${k}">${l}</button>`).join('')+`</div>`}
function empty(t){return `<div class="empty">${t}</div>`}
function sampleTag(r){return r.is_sample?'<span class="badge">sample</span>':''}
function checklist(t,list,opt={}){
  if(!list.length)return empty(opt.empty||'Nothing here yet. Add your first one below.');
  return list.map(r=>{
    const on=opt.vit?r.done_date===today():!!r.done;
    return `<div class="item"><button class="tick ${on?'on':''}" data-a="toggle" data-t="${t}" data-id="${r.id}" aria-label="Tick">${on?'✓':''}</button><div class="grow"><span class="${on&&!opt.vit?'done':''}">${esc(r.label||r.name)}</span>${sampleTag(r)}${opt.extra?`<div class="muted">${opt.extra(r)}</div>`:''}</div><button class="x" data-a="del" data-t="${t}" data-id="${r.id}" aria-label="Remove">×</button></div>`}).join('');
}
function addBox(t,ph,extra=''){return `<form data-form="${t}" class="row" style="margin-top:12px;flex-wrap:wrap"><input name="label" placeholder="${ph}" required style="flex:1;min-width:140px">${extra}<button class="btn small" type="submit">Add</button></form>`}

function vHome(){
  const p=preg(),name=esc(S.profile.name||'lovely');
  const done=rows('task_logs').filter(r=>r.log_date===today()).map(r=>r.task_key);
  const appts=rows('appointments').filter(a=>a.appt_date>=today()).sort((a,b)=>(a.appt_date+(a.appt_time||'')).localeCompare(b.appt_date+(b.appt_time||'')));
  let hero='';
  if(p&&p.wk>=0&&p.wk<=42){
    hero=`<div class="card hero"><div class="muted">${tri(p.wk)}</div><div class="big">Week ${p.wk}</div><p>${p.dd} day${p.dd===1?'':'s'} in. ${p.left>0?`<b>${p.left}</b> day${p.left===1?'':'s'} until your due date.`:'Your due date has arrived. Sending you all my love.'}</p><div class="bar"><i style="width:${p.pct}%"></i></div></div>`;
  }else hero=`<div class="card hero"><h2>Add your due date</h2><p>Pop it in the Me tab and I will show your week and countdown.</p></div>`;
  return `<h1>Hello, ${name}</h1><p class="muted">Here is your day, nice and gentle.</p>${hero}
  <div class="card"><h2>Today's little list</h2>${SAMPLE.tasks.map(([k,l])=>`<div class="item"><button class="tick ${done.includes(k)?'on':''}" data-a="task" data-k="${k}">${done.includes(k)?'✓':''}</button><div class="grow ${done.includes(k)?'done':''}">${l}</div></div>`).join('')}<div class="muted">${done.length} of ${SAMPLE.tasks.length} done</div></div>
  <div class="sc"><button data-a="go" data-tab="diary" data-g="diary" data-k="food"><b>🍓</b>Food diary</button><button data-a="go" data-tab="diary" data-g="diary" data-k="mood"><b>🌸</b>Mood</button><button data-a="go" data-tab="diary" data-g="diary" data-k="sleep"><b>🌙</b>Sleep</button><button data-a="go" data-tab="baby" data-g="baby" data-k="journal"><b>📸</b>Baby journal</button><button data-a="go" data-tab="baby" data-g="baby" data-k="letters"><b>💌</b>Letter to you</button><button data-a="go" data-tab="baby" data-g="baby" data-k="book"><b>📖</b>E-book</button></div>
  <div class="card"><h2>Coming up</h2>${appts.length?appts.slice(0,4).map(a=>`<div class="item"><div class="grow"><b>${esc(a.title)}</b><div class="muted">${fmtDate(a.appt_date)}${a.appt_time?' at '+esc(a.appt_time):''}${a.note?' · '+esc(a.note):''}</div></div><button class="x" data-a="del" data-t="appointments" data-id="${a.id}">×</button></div>`).join(''):empty('No appointments yet.')}
  <details><summary>Add an appointment</summary><form data-form="appointments"><label>What is it?</label><input name="title" required placeholder="e.g. Midwife visit"><div class="grid2"><div><label>Date</label><input type="date" name="appt_date" required></div><div><label>Time</label><input type="time" name="appt_time"></div></div><label>Note</label><input name="note" placeholder="Questions to ask, who is coming..."><button class="btn" type="submit">Save appointment</button></form></details></div>`;
}

function vDiary(){

    body=`<div class="card"><h2>Food diary</h2><form data-form="food_entries"><div class="grid2"><div><label>Meal</label><select name="meal"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select></div><div><label>Date</label><input type="date" name="entry_date" value="${today()}"></div></div><label>What I had</label><input name="what" required placeholder="Toast, tea and a banana"><label>How it felt (optional)</label><input name="note" placeholder="Hungry? Queasy? Loved it?"><button class="btn" type="submit">Add to my diary</button></form></div>
    <div class="card"><h3>Recent entries</h3>${list.length?list.map(r=>`<div class="item"><div class="grow"><b>${esc(r.meal)}</b> · ${esc(r.what)}<div class="muted">${fmtDate(r.entry_date)}${r.note?' · '+esc(r.note):''}</div></div><button class="x" data-a="del" data-t="food_entries" data-id="${r.id}">×</button></div>`).join(''):empty('Nothing yet. What did you enjoy today?')}</div>`;

  if(s==='vitamins'){

  if(s==='sleep'){
    const list=rows('sleep_entries').slice().reverse().slice(0,20);

    <div class="card"><h3>Recent nights</h3>${list.length?list.map(r=>`<div class="item"><div class="grow"><b>${r.hours}h</b> · ${['','Rough','Broken','Okay','Pretty good','Dreamy'][r.quality]}<div class="muted">${fmtDate(r.entry_date)}${r.note?' · '+esc(r.note):''}</div></div><button class="x" data-a="del" data-t="sleep_entries" data-id="${r.id}">×</button></div>`).join(''):empty('No nights logged yet.')}</div>`;
  }
  if(s==='mood'){
    const list=rows('mood_entries').slice().reverse().slice(0,20);
    body=`<div class="card"><h2>How am I feeling?</h2><form data-form="mood_entries"><div class="moods">${MOODS.map(([e,l],i)=>`<label title="${l}"><input type="radio" name="mood" value="${e} ${l}" ${i===0?'checked':''}><span>${e}</span></label>`).join('')}</div><label>Date</label><input type="date" name="entry_date" value="${today()}"><label>Want to say more?</label><textarea name="note" placeholder="Whatever is on my mind..."></textarea><button class="btn" type="submit">Save my mood</button></form><p class="muted" style="margin-top:10px">All feelings are welcome here. If you are struggling, please talk to your midwife, GP or someone you trust.</p></div>
    <div class="card"><h3>My mood diary</h3>${list.length?list.map(r=>`<div class="item"><div class="grow"><b>${esc(r.mood)}</b><div class="muted">${fmtDate(r.entry_date)}${r.note?' · '+esc(r.note):''}</div></div><button class="x" data-a="del" data-t="mood_entries" data-id="${r.id}">×</button></div>`).join(''):empty('No entries yet.')}</div>`;

function vBaby(){

    const list=rows('journal_entries').slice().reverse();
    body=`<div class="card"><h2>Baby journal</h2><form data-form="journal_entries"><label>Title</label><input name="title" required placeholder="My first bump photo"><label>Date</label><input type="date" name="entry_date" value="${today()}"><label>Photo (optional)</label><input type="file" name="photo" accept="image/*"><label>My words</label><textarea name="body" placeholder="Write to your baby, or to future you..."></textarea><button class="btn" type="submit">Save to journal</button></form></div>
    ${list.length?list.map(r=>`<div class="card"><div class="row"><div class="grow" style="flex:1"><h3>${esc(r.title)}</h3><div class="muted">${fmtDate(r.entry_date)}</div></div><button class="x" data-a="del" data-t="journal_entries" data-id="${r.id}">×</button></div>${r.photo?`<img class="photo" src="${r.photo}" alt="">`:''}<p>${esc(r.body).replace(/\n/g,'<br>')}</p></div>`).join(''):`<div class="card">${empty('Your first page is waiting.')}</div>`}`;

    }else{
      const c=EBOOK[S.ch];
      body=`<div class="card ebook"><button class="btn ghost small" data-a="chapter" data-i="-1">‹ All chapters</button><h2 style="margin-top:14px">${esc(c[0])}</h2>${c[1]?`<h3 style="margin-bottom:10px">${esc(c[1])}</h3>`:''}${c[2]}<div class="row" style="margin-top:18px;gap:8px">${S.ch>0?`<button class="btn ghost small" data-a="chapter" data-i="${S.ch-1}">‹ Previous</button>`:''}<span style="flex:1"></span>${S.ch<EBOOK.length-1?`<button class="btn small" data-a="chapter" data-i="${S.ch+1}">Next ›</button>`:''}</div></div>`;
    }
  }
  if(s==='letters'){
    const list=rows('letters').slice().reverse();
    body=`<div class="card"><h2>Letter to you</h2><p class="muted" style="margin-bottom:6px">Write to your little one whenever the mood takes you. They can read them one day.</p><form data-form="letters"><label>Title</label><input name="title" required placeholder="The day I found out about you"><div class="grid2"><div><label>Date</label><input type="date" name="entry_date" value="${today()}"></div><div><label>Open when (optional)</label><input name="open_when" placeholder="you turn 18"></div></div><label>Dear baby...</label><textarea name="body" required rows="8" placeholder="Dear little one,"></textarea><button class="btn" type="submit">Save my letter</button></form></div>
    ${list.length?list.map(r=>`<div class="card"><div class="row"><div style="flex:1"><h3>${esc(r.title)}</h3><div class="muted">${fmtDate(r.entry_date)}${r.open_when?' · open when '+esc(r.open_when):''}</div></div><button class="x" data-a="del" data-t="letters" data-id="${r.id}">×</button></div><p style="font-style:italic;margin-top:10px">${esc(r.body).replace(/\n/g,'<br>')}</p></div>`).join(''):`<div class="card">${empty('Your first letter is waiting. Start with "Dear baby".')}</div>`}`;
  }
  return `<h1>My Baby</h1>${chips('baby',[['journal','Journal'],['letters','Letter to you'],['names','Names'],['book','E-book']])}${body}`;
}

function vPlan(){
  const s=S.sub.plan;let body='';
  if(s==='shopping'){
    const list=rows('shopping_items'),order={High:0,Medium:1,Low:2};
    list.sort((a,b)=>(order[a.priority]-order[b.priority]));
    const total=list.reduce((n,r)=>n+(Number(r.price)||0),0),spent=list.filter(r=>r.done).reduce((n,r)=>n+(Number(r.price)||0),0);
    const budget=Number(S.profile.budget)||0;
    body=`<div class="card hero"><div class="muted">Planned total</div><div class="big">£${total.toFixed(0)}</div><p class="muted">Bought so far £${spent.toFixed(0)}${budget?` · Budget £${budget.toFixed(0)} (${budget-total>=0?'£'+(budget-total).toFixed(0)+' to spare':'£'+(total-budget).toFixed(0)+' over'})`:''}</p>${budget?`<div class="bar"><i style="width:${Math.min(100,total/budget*100)}%"></i></div>`:''}</div>
    <div class="card"><h2>Baby shopping list</h2><p class="muted">Sample items and prices are placeholders. Swap in your own.</p>${checklist('shopping_items',list,{extra:r=>`${esc(r.priority)} priority · £${Number(r.price||0).toFixed(0)}`})}
    <form data-form="shopping_items"><label>Item</label><input name="label" required placeholder="Item"><div class="grid2"><div><label>Price (£)</label><input type="number" name="price" min="0" step="1"></div><div><label>Priority</label><select name="priority"><option>High</option><option selected>Medium</option><option>Low</option></select></div></div><button class="btn" type="submit">Add to list</button></form></div>`;
  }
  if(s==='timeline'){
    const p=preg();
    body=`<div class="card"><h2>Pregnancy timeline <span class="badge">sample content</span></h2><p class="muted">Gentle ideas for each stage, not medical advice.</p><div class="tl">${TIMELINE.map(([w,t])=>{const c=p?(p.wk>=w&&p.wk<w+4?'now':p.wk>=w+4?'past':''):'';return `<div class="s ${c}"><b>Week ${w}</b>${c==='now'?'<span class="badge">you are here</span>':''}<div>${t}</div></div>`}).join('')}</div></div>`;
  }
  if(s==='bag'){
    const l=rows('bag_items'),n=l.filter(r=>r.done).length;
    body=`<div class="card"><h2>Hospital bag</h2><p class="muted">${n} of ${l.length} packed. Sample list to get you started, edit freely.</p>${checklist('bag_items',l)}${addBox('bag_items','Add something to pack')}</div>`;
  }
  return `<h1>Planning</h1>${chips('plan',[['shopping','Shopping'],['timeline','Timeline'],['bag','Hospital bag']])}${body}`;
}

  const p=S.profile,l=rows('selfcare_items');

  <div class="card"><h2>My details</h2><form data-form="profile"><label>First name</label><input name="name" value="${esc(p.name)}" required><label>Due date</label><input type="date" name="due_date" value="${esc(p.due_date)}"><label>Baby shopping budget (£, optional)</label><input type="number" name="budget" min="0" value="${esc(p.budget)}"><button class="btn" type="submit">Save</button></form></div>

  <p class="note">Hello Baby is a journal and planner, not medical advice. For anything about your health or your baby, please speak to your midwife or GP.</p>`;

function vWelcome(){
  const auth=sb?`<form data-form="auth"><label>Email</label><input type="email" name="email" required><label>Password</label><input type="password" name="password" minlength="8" required><button class="btn" type="submit" name="mode" value="up">Create my account</button><button class="btn ghost" type="submit" name="mode" value="in">I already have one</button></form>`:
  `<form data-form="onboard"><label>What shall I call you?</label><input name="name" required placeholder="Your first name"><label>When is baby due?</label><input type="date" name="due_date"><button class="btn" type="submit">Start my journal</button><p class="note">Demo mode: your journal is saved on this device only.</p></form>`;

/* ---------- render ---------- */
const NAV=[['home','🏠','Home'],['diary','📖','My Diary'],['baby','👶','My Baby'],['plan','🗓️','Planning'],['me','💗','Me']];
const FOOT='<p class="foot">This app was made for Isabella &amp; Baby Gregory by Nana Wormo 2026</p>';
function render(){render0();$('#app').insertAdjacentHTML('beforeend',FOOT)}
function render0(){
  const nav=$('#nav');
  if(!DB.user){nav.hidden=true;$('#app').innerHTML=vWelcome();return}
  if(!S.profile){nav.hidden=true;$('#app').innerHTML=`<div class="welcome"><div class="big">Nearly there</div></div><div class="card"><form data-form="onboard"><label>What shall I call you?</label><input name="name" required><label>When is baby due?</label><input type="date" name="due_date"><button class="btn" type="submit">Start my journal</button></form></div>`;return}
  nav.hidden=false;
  nav.firstElementChild.innerHTML=NAV.map(([k,i,l])=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-k="${k}"><span>${i}</span>${l}</button>`).join('');
  const v={home:vHome,diary:vDiary,baby:vBaby,plan:vPlan,me:vMe}[S.tab]();
  $('#app').innerHTML=header()+v;
}

/* ---------- photos ---------- */
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),4000)}
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=900,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.75))};im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,d=b.dataset;
  if(a==='tab'){S.tab=d.k;scrollTo(0,0)}
  else if(a==='sub'){S.sub[d.g]=d.k;if(d.k==='book')S.ch=null}
  else if(a==='chapter'){S.ch=Number(d.i)<0?null:Number(d.i);window.scrollTo(0,0)}
  else if(a==='go'){S.tab=d.tab;S.sub[d.g]=d.k;scrollTo(0,0)}
  else if(a==='toggle'){
    const r=rows(d.t).find(x=>x.id===d.id);
    if(d.t==='vitamin_items')await upd(d.t,d.id,{done_date:r.done_date===today()?null:today()});
    else await upd(d.t,d.id,{done:!r.done});
  }
  else if(a==='del'){await del(d.t,d.id)}
  else if(a==='fav'){const r=rows('baby_names').find(x=>x.id===d.id);await upd('baby_names',d.id,{fav:!r.fav})}
  else if(a==='task'){
    const ex=rows('task_logs').find(x=>x.task_key===d.k&&x.log_date===today());
    if(ex)await del('task_logs',ex.id);else await add('task_logs',{task_key:d.k,log_date:today()});
  }
  else if(a==='savemeal'){const m=MEALS[d.i];await add('food_entries',{meal:'Meal idea',what:m[0],entry_date:today(),note:'Saved from meal inspiration'});S.sub.diary='food'}
  else if(a==='signout'){
    if(sb){await sb.auth.signOut();DB.user=null;S.profile=null}
    else if(!S.cr){S.cr=true;toast('Tap again to clear all demo data on this device.')}else{S.cr=false;['profile',...TABLES].forEach(t=>ls.del(DB.key(t)));S.profile=null;await loadAll()}
  }
  render();
});

document.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const t=f.dataset.form,fd=new FormData(f),row={};
  for(const[k,v]of fd.entries()){if(k!=='photo'&&k!=='mode')row[k]=v}
  f.querySelectorAll('input[type=number]').forEach(i=>{row[i.name]=i.value===''?null:Number(i.value)});
  try{
    if(t==='auth'){
      const mode=e.submitter&&e.submitter.value;
      const r=mode==='up'?await sb.auth.signUp({email:row.email,password:row.password}):await sb.auth.signInWithPassword({email:row.email,password:row.password});
      if(r.error){toast(r.error.message);return}
      if(!r.data.session){toast('Check your emails to confirm your account, then sign in.');return}
      DB.user=r.data.session.user;await loadAll();
    }
    else if(t==='onboard'){S.profile={name:row.name,due_date:row.due_date||null};await DB.saveProfile(S.profile);S.profile=await DB.getProfile();if(!rows('bag_items').length)await seed();await loadAll()}
    else if(t==='profile'){S.profile={...S.profile,...row,due_date:row.due_date||null};await DB.saveProfile(S.profile);S.profile=await DB.getProfile()}
    else{
      const file=f.querySelector('input[type=file]');
      if(file&&file.files[0])row.photo=await shrink(file.files[0]);
      if(t==='shopping_items'||t==='bag_items'||t==='selfcare_items')row.done=false;
      await add(t,row);
    }
  }catch(err){toast('Sorry, that did not save. '+(err.message||''))}
  render();
});

/* ---------- start ---------- */
(async function start(){
  if(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY){
    await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
    sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
    const{data}=await sb.auth.getSession();
    if(data.session){DB.user=data.session.user;await loadAll()}
  }else{
    let id=ls.get('hb:device');if(!id){id=uid();ls.set('hb:device',id)}
    DB.user={id};await loadAll();
  }
  render();
})();
</script>
