<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kind Words</title>
<style>
  :root{--gold:#c9a24b;--cream:#f3ece4;--muted:#c9bfb0;--line:#3a3328}
  *{box-sizing:border-box}
  body{margin:0;background:#0b0b0b;color:#faf6f0;font-family:"Helvetica Neue",Arial,system-ui,sans-serif;line-height:1.55}
  .wrap{max-width:1000px;margin:0 auto;padding:40px 16px 80px}
  .tag{display:inline-block;background:var(--gold);color:#000;padding:4px 12px;border-radius:99px;font:700 .78rem/1.4 system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase}
  h1{font-family:Georgia,serif;font-size:clamp(2.1rem,7vw,3.4rem);line-height:1.08;margin:12px 0;color:var(--cream)}
  h1 em{color:var(--gold)}
  .lede{color:var(--muted);font-size:1.1rem;margin:0 0 28px;max-width:640px}
  .summary{display:flex;align-items:center;gap:16px;margin:0 0 32px;flex-wrap:wrap}
  .big{font-size:3rem;font-weight:900;color:var(--gold);line-height:1}
  .stars{color:var(--gold);font-size:1.5rem;letter-spacing:2px}
  .off{color:#3a3631}
  .count{color:var(--muted);font-size:.95rem}
  .grid{columns:2 320px;column-gap:16px}
  .card{break-inside:avoid;background:#151413;border:1px solid var(--line);border-radius:18px;padding:22px;margin:0 0 16px}
  .card .stars{font-size:1.15rem}
  .quote{font-style:italic;font-family:Georgia,serif;font-size:1.05rem;margin:12px 0;white-space:pre-wrap;border-left:3px solid var(--gold);padding-left:12px}
  .who{font-weight:800}
  .handle{color:var(--muted);font-size:.9rem}
  .empty{color:var(--muted);text-align:center;padding:60px 0}
  .cta{display:inline-block;margin-top:24px;background:var(--gold);color:#000;font:700 1rem system-ui,sans-serif;padding:14px 28px;border-radius:99px;text-decoration:none}
  .cta:hover{background:var(--cream)}
</style>
</head>
<body>
<div class="wrap">
  <span class="tag">Kind words</span>
  <h1 id="h1">What my girls <em>say.</em></h1>
  <p class="lede">Real reviews from real clients. Every one written by them, in their own words.</p>
  <div class="summary" id="summary" hidden>
    <div class="big" id="avg"></div>
    <div><div class="stars" id="avgstars"></div><div class="count" id="cnt"></div></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Reviews are on their way. Check back soon.</div>
  <a class="cta" id="cta" href="#" hidden>Leave a review</a>
</div>
<script>
(function(){
  var qs = new URLSearchParams(location.search);
  var SALON = (qs.get("salon")||"").trim().slice(0,120), OWNER = (qs.get("owner")||"").trim().slice(0,60);
  if(SALON){ document.title = SALON + " | Kind Words"; document.getElementById("h1").innerHTML = "What " + (OWNER ? OWNER.replace(/[&<>"']/g,"") + "'s" : "my") + " girls <em>say.</em>"; }
  var cta = document.getElementById("cta");
  if(SALON){ cta.href = "/nail-reviews?salon="+encodeURIComponent(SALON)+(OWNER?"&owner="+encodeURIComponent(OWNER):""); cta.hidden = false; }
  function stars(n){ var r=Math.round(n),s=""; for(var i=1;i<=5;i++){ s+='<span class="'+(i<=r?"":"off")+'">★</span>'; } return s; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  if(!SALON){ document.getElementById("empty").hidden=false; return; }
  fetch("/api/nail-reviews/public?salon="+encodeURIComponent(SALON)).then(function(r){return r.json();}).then(function(d){
    var list=(d&&d.reviews)||[];
    if(!list.length){ document.getElementById("empty").hidden=false; return; }
    var sum=0; list.forEach(function(r){ sum+=Number(r.average); });
    var avg=sum/list.length;
    document.getElementById("avg").textContent=avg.toFixed(1);
    document.getElementById("avgstars").innerHTML=stars(avg);
    document.getElementById("cnt").textContent="from "+list.length+" review"+(list.length===1?"":"s");
    document.getElementById("summary").hidden=false;
    document.getElementById("grid").innerHTML=list.map(function(r){
      return '<div class="card"><div class="stars">'+stars(r.average)+'</div>'+
        '<div class="quote">“'+esc(r.heart)+'”</div>'+
        '<div class="who">'+esc(r.name)+'</div>'+
        (r.handle?'<div class="handle">'+esc(r.handle)+'</div>':'')+'</div>';
    }).join("");
  }).catch(function(){ document.getElementById("empty").hidden=false; });
})();
</script>
</body>
</html>
