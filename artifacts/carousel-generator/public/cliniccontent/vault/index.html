<style>
  :root{
    --bg:#08080D; --bg-panel:#100f16; --card:#151319;

    --pink:#FF1493; --tan:#C4937F;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--cream);
    font-family:'League Spartan','Helvetica Neue',sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:10; background:rgba(8,8,13,0.92); backdrop-filter:blur(8px);
    display:flex;justify-content:space-between;align-items:center;
    padding:18px 24px;border-bottom:1px solid var(--border);
  }
  .logo{font-weight:800;font-size:18px;letter-spacing:-0.02em;}
  .logo span{color:var(--pink);}
  .count-badge{
    background:rgba(255,20,147,0.12);color:var(--pink);font-weight:700;
    padding:7px 16px;border-radius:100px;font-size:13px;
  }
  .intro{padding:50px 24px 30px;text-align:center;}
  .eyebrow{
    color:var(--tan);text-transform:uppercase;letter-spacing:0.14em;
    font-size:13px;font-weight:700;margin-bottom:16px;
  }
  h1{font-weight:800;font-size:40px;letter-spacing:-0.02em;margin-bottom:14px;}
  h1 .pink{color:var(--pink);}
  .sub{color:var(--cream-dim);font-size:16px;max-width:560px;margin:0 auto;font-weight:500;}

  .controls{
    max-width:1000px;margin:0 auto;padding:0 24px 30px;
    display:flex;flex-direction:column;gap:16px;
  }
  .search-box{
    width:100%;padding:14px 20px;border-radius:100px;border:1px solid var(--border);
    background:var(--card);color:var(--cream);font-family:inherit;font-size:15px;font-weight:500;
    outline:none;
  }
  .search-box::placeholder{color:var(--cream-faint);}
  .search-box:focus{border-color:var(--pink);}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .chip{
    padding:9px 18px;border-radius:100px;border:1px solid var(--border);
    background:var(--card);color:var(--cream-dim);font-family:inherit;font-size:13px;font-weight:700;
    cursor:pointer;transition:all .15s ease; white-space:nowrap;
  }
  .chip:hover{border-color:var(--pink);color:var(--cream);}
  .chip.active{background:var(--pink);color:#08080D;border-color:var(--pink);}

  .vault{max-width:1000px;margin:0 auto;padding:0 24px 100px;}
  .cat-section{margin-bottom:50px;}
  .cat-title{
    display:flex;align-items:center;gap:12px;margin-bottom:18px;
  }
  .cat-title h2{font-weight:800;font-size:22px;letter-spacing:-0.01em;}
  .cat-title .n{color:var(--tan);font-size:13px;font-weight:700;}
  .hook-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .hook-card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:18px 20px;font-size:14.5px;font-weight:500;color:var(--cream);
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    cursor:pointer; transition:border-color .15s ease;
  }
  .hook-card:hover{border-color:rgba(255,20,147,0.4);}
  .hook-text{flex:1;line-height:1.5;}
  .copy-btn{
    flex-shrink:0;width:30px;height:30px;border-radius:8px;background:rgba(255,20,147,0.1);
    color:var(--pink);display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;border:none;cursor:pointer;
  }
  .copy-btn.copied{background:var(--pink);color:#08080D;}
  .empty-state{
    text-align:center;padding:60px 24px;color:var(--cream-faint);font-size:15px;font-weight:500;
  }
  @media (max-width:720px){
    h1{font-size:28px;}
    .hook-grid{grid-template-columns:1fr;}
  }
</style>
</head>

ners really said \"small changes, big difference\" and turned it into a personality trait.","Me, quietly delighted every time someone remembers to bring their own questions written down.","Not the whole team getting sentimental over a patient's five-year loyalty milestone.","The unofficial clinic tradition: celebrating every single \"I finally feel like me again.\"","Practitioner brain: incapable of watching a wedding video without clocking everyone's skincare.","Me, internally throwing confetti every time a patient's confidence visibly shifts mid-appointment.","Not us developing genuine opinions about patients we've never even treated yet.","The clinic's unofficial love language: remembering exactly how someone takes their tea during consultations.","Practitioners really invented \"let's revisit this in a few weeks\" and made waiting feel productive.","Me, five years in, still getting emotional over a good confidence comeback story.","Not the reception desk running informal commentary on every single walk-in's glow.","The clinic's actual currency: good energy, bad puns, and the occasional shared biscuit.","Practitioner brain: rating strangers' skincare routines purely as an involuntary reflex.","Me, quietly thrilled every time a patient finally stops apologising for asking questions.","Not us collectively deciding a nervous laugh in the consultation room is the best kind of laugh.","The unofficial clinic hall of fame: every single patient who finally said yes to themselves.","Practitioners really said \"we'll get there together\" and somehow made it sound like a promise, not a script.","Me, internally narrating every mirror moment like it's the final scene of a film.","Not the whole team getting invested in a first-timer's transformation like it's a group project.","The clinic's best kept secret: half our best advice happens in the small talk before the actual consultation.","Practitioner brain: incapable of small talk without accidentally giving out free skincare titioner and an independent one.","Why practitioners are taught to document conversations, not just treatments.","What genuine transparency about training and qualifications should actually look like.","The real reason some treatments require a cooling off period by law, not by choice.","Why ethical practice sometimes means turning away business, and why that should reassure you, not concern you."],"Before/After":["Same face, more confidence. That's the actual before and after that matters.","The transformation isn't always visible in a photo. Sometimes it's how someone stands afterwards.","Six months of consistency looks like this. Not a miracle, just patience.","The best before and after we've seen this year wasn't dramatic, it was quiet confidence.","What changed wasn't just the face, it was how she talked about herself afterwards.","Before: nervous and unsure. After: walking in like she owns the room. That's the real result.","The photo doesn't show the four consultations it took to get the plan right.","Not every transformation is loud. Some of the best ones are barely noticeable, and that's the point.","Before: hiding from photos. After: taking them without thinking twice. That's what we're actually measuring.","The result that mattered most wasn't on the skin, it was in the way she talked about herself.","Same bone structure, same features, just better cared for. That's the honest version of \"transformation.\"","What you can't see in this photo: the two months of patience it took to get here.","Before: convinced nothing would work. After: wishing she'd started sooner.","The real before and after is the conversation, not just the photo.","Subtle enough that only she notices the difference, and that's exactly how she wanted it.","Before: covering up. After: not thinking about it at all. That's the goal, every time.","The transformation people don't talk about enough: the confidence to stop comparing.","What changed in six weeks wasn't dramatic, it was consistent. That's usually how it works.","Before: asking \"is this normal?\" constantly. After: barely thinking about it. That's progress.","The photo shows the skin. It doesn't show the years of not liking what she saw in the mirror.","Same person, same personality, just a little more at ease in photos. That's the whole point.","Before: avoiding eye contact in consultations. After: asking all the right questions with confidence.","What actually changed wasn't just visible, it was how long it took her to stop second guessing herself.","The most honest before and after isn't the photo, it's the way someone answers \"how do you feel\" afterwards.","Before: three years of \"maybe next year.\" After: wishing she hadn't waited.","Not every result needs a filter. Some of the best ones are the least edited photos we have.","The transformation nobody photographs: someone finally feeling like themselves again.","Before: constant comparison. After: barely checking anymore. That's the real shift.","What changed over these months wasn't loud, but she noticed it every single day.","The best part of this before and after isn't the skin, it's the way she talks now.","Same face, same laugh lines, just more at peace with them. That's a result too.","Before: nervous about every photo taken of her. After: not thinking twice.","The transformation that matters most rarely fits in a single photo.","What you're seeing here took patience, not perfection.","Before: hesitant, unsure, asking a hundred questions. After: confident, informed, glad she asked them.","The real result isn't just visible, it's audible, in how differently she talks about herself now.","Same features, just less tension held in the face. That's often the biggest change nobody names.","Before: avoiding certain angles in photos. After: not even thinking about angles anymore.","What changed wasn't overnight, and that's exactly why it's lasted.","The photo captures a moment. It doesn't capture the months of consistency that got her there.","Before: convinced she'd left it too late. After: wishing more people knew it's never too late.","Not every transformation needs before and after side by side, some just need \"and now she smiles more.\"","What actually changed over these appointments wasn't dramatic, it was steady, and that's the version that lasts.","The result you can't see: she stopped avoiding mirrors somewhere around week four.","Before: unsure if any of this was \"for her.\" After: certain it was the right call.","Same person, just less time spent worrying about something that used to take up so much headspace.","The transformation that mattered most happened in the consultation room, before any treatment even started.","What changed wasn't just her face, it was how much time she spent thinking about it.","Before: apologising for wanting this. After: not apologising for anything.","The best before and after isn't always about difference, sometimes it's about relief.","The real change wasn't in the mirror, it was in how long she looked at it.","Before: cancelling plans over how she felt in photos. After: not thinking twice about either.","What actually shifted wasn't dramatic, it just finally stuck.","The transformation that mattered most was the one nobody could photograph.","Before: three consultations of \"I'm not sure.\" After: wishing she'd started at the first one.","Not every result needs applause. Some just need quiet relief.","The best part of this journey wasn't the outcome, it was watching her stop apologising along the way.","Before: comparing herself daily. After: barely thinking about it.","What changed over these months wasn't obvious to anyone but her, and that was enough.","The real result: she finally stopped holding her breath in every photo.","Before: avoiding video calls. After: not thinking about the camera at all.","Not every transformation photographs well, and that's exactly why this one mattered more than most.","The change that stuck wasn't sudden, it was steady, appointment after appointment.","Before: three years of \"someday.\" After: wishing someday had come sooner.","What actually shifted was her posture before anything else did.","The best before and afters are the ones where nobody else notices, but she does, every day.","Before: dreading her own reflection. After: barely registering the mirror at all, which was the whole point.","Not every result is visible in a single photo, some only show up in how someone answers a simple question.","The transformation that mattered most happened somewhere around the third appointment, quietly.","Before: hesitant, guarded, unsure. After: relaxed, open, glad she asked every question she had.","What changed wasn't just her face, it was how much space the worry used to take up.","The real shift: she stopped explaining herself for wanting this.","Before: nervous laughter in every consultation. After: genuine laughter, unprompted.","Not every after photo needs a dramatic before, sometimes steady and consistent is the whole story.","The change that mattered most: she finally believed the compliments instead of deflecting them.","Before: convinced this wasn't \"her kind of thing.\" After: recommending it to every friend who asks.","What actually shifted over these weeks was confidence, long before anything else caught up.","The best result isn't always visible, sometimes it's just relief, plain and simple.","Before: three consultations of hesitation. After: wondering why she waited so long to start.","Not every transformation is about change, some are just about finally feeling settled.","The real before and after: less time spent thinking about it, more time spent living.","Before: bracing for judgement. After: not expecting any, because there wasn't any to begin with.","What changed wasn't sudden or dramatic, it just quietly became normal.","The transformation that mattered most was internal, and it showed up in everything else eventually.","Before: avoiding the topic entirely. h: it's often the opposite.","Myth: results should look the same on everyone. Truth: the same approach on different faces gives completely different outcomes, on purpose.","Myth: cheaper always means the same quality, just a better price. Truth: price differences usually reflect training, products and safety standards.","Myth: patch tests are just a formality. Truth: they're one of the only ways to catch a reaction before it becomes a problem.","Myth: more reviews means more trustworthy. Truth: reviews say nothing about qualifications or safety record.","Myth: if it's popular online, it's probably safe. Truth: popularity and safety are two completely different things.","Myth: a clinic that treats you same day is being efficient. Truth: proper consultations often need more than one appointment.","Myth: the best practitioners never say no. Truth: the best ones say no more often than you'd think.","Myth: aftercare is optional if you're careful. Truth: it's not optional, it's part of the treatment.","Myth: results are instant. Truth: most results settle and develop over days or weeks, not minutes.","Myth: if a friend had a good result, you'll get the same one. Truth: every face responds differently.","Myth: qualifications don't matter as much as experience. Truth: both matter, and neither replaces the other.","Myth: a clinic with the most followers is the safest choice. Truth: social media presence has nothing to do with clinical training.","Myth: consultations are just a sales pitch. Truth: a proper one is where the actual clinical decisions happen.","Myth: skin only changes with age, not lifestyle. Truth: sleep, stress and hydration show up on your face constantly.","Myth: more products in your routine means better skin. Truth: consistency with fewer products often outperforms an overloaded routine.","Myth: if it worked quickly, it'll last. Truth: speed and longevity aren't related.","Myth: practitioners can tell exactly what you need just by looking. Truth: a proper assessment takes time, questions and often more than one visit.","Myth: everyone heals at the same rate. Truth: healing time varies hugely and has nothing to do with how \"well\" the treatment went.","Myth: if you're not told about risks, there aren't any. Truth: every treatment carries some risk, and you should always be told.","Myth: the newest technology is always the best option. Truth: newer isn't automatically better, it's just newer.","Myth: a good practitioner can treat any face the same way. Truth: good practitioners adapt their approach every single time.","Myth: if it's not painful, it's not working. Truth: comfort and effectiveness aren't connected.","Myth: once you start, you can't stop. Truth: you're always in control of your own treatment plan.","Myth: clinics that ask lots of questions are being difficult. Truth: they're being responsible.","Myth: subtle results mean the treatment \"didn't work.\" Truth: subtle is often exactly what was planned.","Myth: skincare doesn't matter if you're having treatments anyway. Truth: your skincare routine affects your results more than most people realise.","Myth: a clinic without a waiting list isn't in demand. Truth: it might just mean they don't overbook.","Myth: if it's trending, it must be tested and safe. Truth: trends move faster than research often does.","Myth: practitioners can undo any past treatment easily. Truth: some past treatments limit future options significantly.","Myth: consultations are the same everywhere. Truth: what's covered in a consultation varies hugely between clinics.","Myth: a clinic that talks about complications is trying to scare you. Truth: they're being transparent, which is what you want.","Myth: more frequent treatments give faster results. Truth: overdoing it can undo progress, not speed it up.","Myth: if you don't ask, there's nothing to worry about. Truth: not being told isn't the same as there being no risk.","Myth: everyone's timeline for results is the same. Truth: it varies person to person, and that's completely normal.","Myth: a busy clinic is automatically a good clinic. Truth: busy sometimes just means well marketed, not well practiced.","Myth: skincare brands endorsed by influencers are clinically tested the same way. Truth: endorsement and evidence are not the same thing.","Myth: you should feel dramatic results to know it worked. Truth: sometimes the absence of a problem is the actual result.","Myth: practitioners want you to keep coming back for more. Truth: good ones want you to need less over time, not more.","Myth: once you're informed, consent is just a formality. Truth: consent should be an ongoing conversation, not a one time signature.","Myth: a clinic that's been open longer is automatically more experienced. Truth: it depends entirely on who's actually treating you.","Myth: skin concerns are purely cosmetic. Truth: they're often deeply tied to confidence and how people show up in their own lives.","Myth: results should look identical to whoever inspired the treatment. Truth: your own features should always lead the decision, not someone else's.","Myth: if nobody notices, it didn't work. Truth: for a lot of patients, that's exactly the goal.","Myth: practitioners are trying to upsell you every time they explain more options. Truth: informed choice means explaining everything, not just what you asked about.","Myth: once you've had one treatment, you understand the whole industry. Truth: every treatment, practitioner and face is different, every single time.","Myth: a clinic should be able to treat you the same day you enquire. Truth: proper assessment takes time, and rushing it isn't a service, it's a risk.","Myth: more qualifications on a wall means better hands-on skill. Truth: ongoing supervised practice matters as much as the certificates.","Myth: if a treatment is popular, it must be right for most faces. Truth: popularity reflects marketing, not suitability.","Myth: a practitioner should always be able to give you an exact result guarantee. Truth: nobody ethical promises exact outcomes on a living, changing face.","Myth: skin issues are always about skincare products. Truth: sleep, diet, stress and genetics play a much bigger role than most people assume.","Myth: if a clinic doesn't offer financing, it's not accessible. Truth: transparent pricing without pressure is often the more responsible model.","Myth: practitioners should always agree with a patient's self-assessment. Truth: a professional opinion sometimes needs to gently challenge it.","Myth: the more treatments in one visit, the more efficient the appointment. Truth: efficiency should never come before appropriate pacing.","Myth: online consultations are just as thorough as in-person ones for every treatment. Truth: some assessments genuinely require hands-on evaluation.","Myth: a practitioner's own appearance reflects their skill. Truth: judging competence by a practitioner's own face is a flawed measure entirely.","Myth: skin never really changes once you're past a certain age. Truth: skin responds to care and consistency at any age.","Myth: complications are rare enough not to worry about. Truth: they're uncommon with skilled practitioners, but every patient deserves to know they're possible.","Myth: a clinic's social media following reflects its safety record. Truth: those two things have never been connected.","Myth: once you understand one treatment, you understand how they all work. Truth: mechanisms, risks and aftercare vary hugely between treatments.","Myth: a rushed consultation just means the practitioner is confident. Truth: confidence and thoroughness aren't opposites, the best practitioners have both.","Myth: aftercare only matters for the first 48 hours. Truth: some aftercare considerations matter for weeks afterward.","Myth: a practitioner should be able to answer every question instantly. Truth: \"let me check and get back to you properly\" is often the more honest answer.","Myth: a clinic's price list reflects the quality of care you'll receive. Truth: price reflects overheads, training and positioning, not automatically quality.","Myth: skin concerns are always visible to others the way they feel to you. Truth: most people notice far less than patients assume.","Myth: practitioners can always predict exactly how a face will respond. Truth: biology has genuine variability, and honest practitioners say so.","Myth: a clinic without visible before and afters has something to hide. Truth: some clinics prioritise patient privacy over promotional content.","Myth: the number of years in practice is the only measure of experience. Truth: the range and complexity of cases treated matters just as much.","Myth: patients should always know exactly what they want before booking. Truth: \"I'm not sure yet\" is a completely valid starting point.","Myth: a practitioner disagreeing with a trend is being old-fashioned. Truth: sometimes it's genuine clinical caution, not resistance to change.","Myth: skin always bounces back the same way it did in your twenties. Truth: skin's response to treatment and lifestyle changes with age, and that's normal.","Myth: a clinic's location or décor reflects the standard of care. Truth: neither has any bearing on clinical competence.","Myth: if you're not in pain, nothing's happening. Truth: comfort levels vary and have no bearing on whether a treatment is working.","Myth: practitioners should be able to work around any budget. Truth: sometimes the honest answer is that a smaller, appropriate plan is the better option.","Myth: skin concerns always have a single, simple cause. Truth: most concerns are multi-factorial, which is why treatment plans take time to build properly.","Myth: a clinic that turns away walk-ins isn't customer focused. Truth: proper triage and scheduling protects patients, not just the clinic's time.","Myth: once you've had a consultation, you don't need another one for future treatments. Truth: faces, health and goals change, so consultations should too.","Myth: practitioners should always know instantly what treatment you need. Truth: good practitioners ask before they assume, every time.","Myth: a clinic's reviews reflect clinical outcomes accurately. Truth: reviews often reflect experience and service, not clinical results specifically.","Myth: if something is legal, it's automatically safe in the wrong hands. Truth: legality and safe practice are not the same guarantee.","Myth: practitioners should be able to see you exactly when you want an appointment. Truth: a genuinely thorough clinic often has a wait, and that's not a flaw.","Myth: the newest practitioner in a clinic is automatically the least capable. Truth: supervision and training standards matter more than tenure alone.","Myth: skin only needs attention when something looks wrong. Truth: consistent care prevents concerns before they need correcting.","Myth: a practitioner should never say \"that's not something I can help with.\" Truth: knowing your own limits is a sign of genuine professionalism.","Myth: patients should trust marketing claims the same way they'd trust clinical evidence. Truth: the two should never be treated as equivalent.","Myth: a clinic offering every treatment under one roof is more convenient and therefore better. Truth: focused expertise sometimes outperforms broad offering.","Myth: once you've chosen a practitioner, you're locked into their opinion forever. Truth: seeking a second opinion is always a reasonable and welcome choice.","Myth: a clinic should never ask about your mental health before treating you. Truth: responsible practitioners are trained to consider wellbeing as part of suitability.","Myth: aftercare products are just an upsell. Truth: some genuinely support healing and results, and a good practitioner will explain which and why.","Myth: practitioners should be able to fix results from other clinics easily. Truth: correcting someone else's work is often more complex than starting fresh.","Myth: a clinic's confidence in a treatment means there's no risk involved. Truth: confidence in delivery doesn't remove inherent risk, it just means it's managed well.","Myth: patients who ask lots of questions are wasting the practitioner's time. Truth: those questions are exactly what a proper consultation is for.","Myth: a treatment plan should never change once it's been agreed. Truth: good practitioners adjust plans as circumstances and results develop.","Myth: skin concerns are always something to \"fix.\" Truth: sometimes the goal is simply maintenance and prevention, not correction.","Myth: practitioners should be able to work miracles with enough product. Truth: results always have biological and ethical limits, and honest practitioners respect them.","Myth: once you understand the theory, you understand the practice. Truth: hands-on supervised experience is what actually builds real skill."],"Objection-Handling":["\"I'm scared it'll look obvious.\" That's usually the first thing we talk about, and the easiest to plan around.","\"What if I don't like it?\" Most plans are designed to be adjusted, not permanent from the first appointment.","\"I don't know what I actually want.\" That's a completely normal place to start a consultation from.","\"Is it too late for me to start?\" There's rarely a wrong age to have this conversation.","\"I'm worried people will know.\" Subtle, well planned treatment is usually the opposite of obvious.","\"What if it hurts?\" Comfort is part of the plan, not an afterthought.","\"I don't want to look like someone else.\" Good consultations are built around your face, not a reference photo.","\"I've heard horror stories.\" That's exactly why qualifications and proper consultations matter so much.","\"What if my skin reacts badly?\" That's what patch testing and full medical history checks are there for.","\"I'm worried I'll regret it.\" A good practitioner will talk you through every option, including waiting.","\"I don't want anyone to notice.\" Most patients say that, and most leave looking like a well rested version of themselves, not a different person.","\"What if it doesn't work?\" A proper consultation sets realistic expectations before anything happens, not after.","\"I'm nervous about the needle.\" Most patients say the anticipation is worse than the actual appointment.","\"I don't want to feel judged.\" Consultations should feel like a conversation, never an assessment of your choices.","\"What if I can't afford to keep it up?\" A good plan works with your budget, not against it.","\"I've been putting this off for years.\" You're not behind, you're just ready now.","\"What if my partner or family disapproves?\" This is your decision, and a good clinic will always centre what you want.","\"I don't want to become 'that person' who keeps having treatments.\" Most patients want to look like themselves, just a little more at ease.","\"What if the results are permanent and I hate them?\" Most concerns in aesthetics are far more reversible or adjustable than people assume.","\"I'm worried about looking different at work.\" Subtlety is usually the entire point of a well planned treatment.","\"What if I ask a stupid question?\" There's no such thing in a consultation, that's genuinely what it's there for.","\"I don't know if I'm 'ready.'\" Booking a consultation doesn't commit you to anything, it just gets you information.","\"What if the practitioner talks me into something I don't want?\" A good one will talk you out of things just as often.","\"I'm scared of the recovery time.\" Every treatment is different, and that's covered clearly before you book anything.","\"What if people ask what I've had done?\" That's completely your choice to share or not, always.","\"I don't want to spend money on myself.\" This isn't indulgent, it's just another form of looking after yourself.","\"What if I look better in some photos than others afterwards?\" Lighting and angles affect everyone, treated or not.","\"I'm worried it'll become addictive.\" A responsible clinic will always tell you when enough is enough.","\"What if my skin is 'too far gone' to help?\" That phrase gets used a lot, and it's almost never true.","\"I don't want to be treated differently once I've had something done.\" You're the same person, just a bit more at ease in your own face.","\"What if I chicken out halfway through the consultation?\" That's completely fine, and it happens more than people think.","\"I'm scared it'll change how I look in a bad way.\" That fear is exactly why proper consultations exist.","\"What if I need multiple appointments and it gets expensive?\" That should always be explained clearly before you commit to anything.","\"I don't know how to explain what I want.\" Most patients don't, that's what the consultation conversation is for.","\"What if it's obvious I've had 'work done'?\" Most well planned treatment reads as \"well rested,\" not \"different.\"","\"I'm worried about being pressured into booking.\" A good clinic gives you time to think, every time.","\"What if my skin concerns are 'too minor' to bother with?\" If it bothers you, it's worth a conversation, full stop.","\"I don't want it to be the only thing people notice about me.\" That's usually a sign subtlety is the right approach for you.","\"What if I'm too anxious to go through with it?\" Nerves are normal, and a good practitioner will slow down for you.","\"What if I ask to stop halfway through?\" You're allowed to at any point, always.","\"I'm worried it'll hurt more than I can handle.\" Pain tolerance and options are always discussed beforehand, not assumed.","\"What if the results take longer than expected?\" Timelines vary, and that should be explained honestly upfront.","\"I don't want to feel 'high maintenance.'\" Looking after yourself isn't high maintenance, it's just self care.","\"What if I need to explain this to my kids one day?\" Most patients find that conversation far easier than they expected.","\"I'm scared of judgement from the practitioner.\" Good practitioners have heard every concern before, and none of it surprises them.","\"What if this becomes a slippery slope?\" A responsible clinic will always check in on that with you, not just book you in.","\"I don't want to lose my facial expressions.\" That's one of the most common questions in consultations, and a completely fair one to ask.","\"What if I feel silly for caring this much?\" You're allowed to care about how you feel in your own skin.","\"What if it's not 'me' anymore afterwards?\" The goal is usually to feel more like yourself, not less.","\"What if I ask and the answer is no?\" Then you'll have more information than you did before, and that's never wasted.","\"I don't want to feel obligated to keep going once I start.\" You're never locked into anything beyond a single appointment at a time.","\"What if I get emotional during the consultation?\" That happens more than you'd think, and it's never treated as anything other than completely normal.","\"I'm worried I'll be talked into more than I came in for.\" A good consultation ends with your decision, not a sales pitch.","\"What if I don't know how to describe what's bothering me?\" You don't need the right words, just a starting point, we'll build from there together.","\"I'm scared I'll be the oldest or youngest person to have ever asked about this.\" You genuinely won't be, and it wouldn't matter if you were.","\"What if I want a second opinion after this consultation?\" That's completely reasonable, and any good practitioner will support that decision.","\"I don't want to feel like just another appointment on the schedule.\" A proper consultation should never feel rushed, and if it does, that's worth trusting your instinct on.","\"What if I change my mind after booking?\" You're allowed to, right up until the moment treatment actually begins.","\"I'm worried about what my results will look like in ten years.\" That's a completely fair question, and a responsible practitioner will talk you through long-term considerations honestly.","\"What if I need to bring someone with me for support?\" Most clinics welcome that, and it's a completely normal thing to ask for.","\"I don't want to be remembered as 'difficult' for asking questions.\" Asking questions has never once made a patient difficult, it makes them informed.","\"What if the results don't match what I saw online?\" Honest practitioners will always explain how your face differs from a reference photo, and why that's actually a good thing.","\"I'm worried my skin is different to what practitioners usually see.\" Every practitioner has seen more variation than you'd expect, you won't surprise anyone.","\"What if I need longer to think it over than most people do?\" Take exactly as long as you need, there's no clock running on this decision.","\"I don't want to feel rushed into choosing a treatment today.\" A good consultation never requires a same-day decision.","\"What if my reasons for wanting this feel silly to explain?\" They won't sound silly, and even if they did, they're still valid reasons.","\"I'm worried about the cost of maintaining results long term.\" That should be part of the conversation from the very first appointment, not a surprise later.","\"What if I've read conflicting information online?\" Bring every question you have, that's exactly what the consultation is for.","\"I don't want my GP or family to find out unless I choose to tell them.\" That's entirely your choice, and no clinic should ever pressure you otherwise.","\"What if I'm not sure this is really 'me'?\" That uncertainty is worth exploring in the consultation itself, not a reason to avoid booking one.","\"I'm worried about how this might affect how people see me at work.\" Most patients find the change is subtle enough that this concern doesn't materialise the way they feared.","\"What if my skin doesn't respond the way other people's has?\" It might respond differently, and a good practitioner will track and adjust accordingly.","\"I don't want to feel like I'm chasing something that will never be enough.\" That's an important thing to raise, and a responsible practitioner will talk it through with you honestly.","\"What if I need to cancel last minute?\" Life happens, and a reasonable clinic will have a policy that accounts for that.","\"I'm scared of becoming someone who can't stop.\" A responsible clinic will always have that conversation with you directly, and check in over time.","\"What if I want to bring photos to explain what I mean?\" That's genuinely helpful, and most practitioners welcome visual references as a starting point for conversation.","\"I don't know if my concerns are 'big enough' to bring up.\" There's no threshold, if it's on your mind, it's worth discussing.","\"What if I feel differently about this in a year?\" That's completely possible, and most plans are built with future flexibility in mind.","\"I'm worried about judgement from other people in the waiting room.\" Most clinics manage privacy carefully, and nobody there is thinking about anyone but themselves anyway.","\"What if I need the appointment to run over because I have more questions than expected?\" A good clinic builds in time for exactly that.","\"I don't want this to become something I rely on to feel okay.\" That's an important thing to say out loud, and a good practitioner will take it seriously.","\"What if English isn't my first language and I struggle to explain things?\" A patient practitioner will slow down and work through it with you, however long that takes.","\"I'm worried I'll forget everything discussed in the consultation.\" Ask for it in writing, most clinics are happy to provide a summary.","\"What if my body reacts differently because of a health condition?\" That's exactly why full medical history is taken seriously before anything is agreed.","\"I don't want to feel like I have to justify wanting this.\" You don't, wanting to feel good in yourself is reason enough.","\"What if the consultation makes me more anxious, not less?\" Say so in the moment, a good practitioner will slow down or pause entirely.","\"I'm worried about the appointment being awkward if I decide not to go ahead.\" Deciding not to proceed is one of the most common, completely normal outcomes of a consultation.","\"What if I want to record the consultation to remember everything?\" Many clinics are happy to accommodate that, just ask.","\"I don't want to feel pressured by a discount or time-limited offer.\" A genuinely good decision doesn't need a countdown timer attached to it.","\"What if my skin concerns started after a specific event or period in my life?\" That context matters, and sharing it helps build a more accurate picture, not a judgement.","\"I'm scared the consultation itself will be the hardest part.\" For most people, it turns out to be the easiest and most reassuring part of the whole process.","\"What if I need accommodations because of a disability?\" A good clinic will ask what you need and adapt, rather than expecting you to fit their standard process.","\"I don't want to feel like I'm being sold to during the consultation.\" A consultation focused on your questions, not a sales script, should never feel that way.","\"What if I want to pause partway through a treatment course?\" You're always allowed to pause, adjust, or stop, at any stage.","\"I'm worried about my privacy if I pay by card or leave contact details.\" Ask directly how your data is handled, a transparent clinic will explain clearly.","\"What if I've been let down by a clinic before and I'm nervous to trust another one?\" That context is worth sharing, it helps a new practitioner understand what reassurance you need.","\"I don't want to feel like a number in a busy clinic.\" Ask how they manage continuity of care, a good answer will reassure you quickly.","\"What if I need extra time because I process information slowly?\" Say so, a good practitioner will adjust their pace without hesitation.","\"I'm scared that once I start, there's no going back to how I felt before.\" Feelings about your own face can shift in both directions, and that's worth discussing honestly before you begin.","\"What if I just need someone to tell me it's okay to wait?\" That's a completely valid outcome of a consultation too, and a good practitioner will say so if it's true."]};

const categories = Object.keys(HOOKS);
const chipsEl = document.getElementById('chips');
const vaultEl = document.getElementById('vault');
const searchEl = document.getElementById('searchBox');
const countBadge = document.getElementById('countBadge');

let activeCategory = 'All';
let searchTerm = '';

function totalCount(){
  return Object.values(HOOKS).reduce((sum, arr) => sum + arr.length, 0);
}

function renderChips(){
  const allChip = `<button class="chip ${activeCategory==='All' ? 'active':''}" data-cat="All">All (${totalCount()})</button>`;
  const catChips = categories.map(cat =>
    `<button class="chip ${activeCategory===cat ? 'active':''}" data-cat="${cat}">${cat} (${HOOKS[cat].length})</button>`
  ).join('');
  chipsEl.innerHTML = allChip + catChips;
  chipsEl.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCategory = btn.dataset.cat;
      render();
    });
  });
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render(){
  renderChips();
  const term = searchTerm.trim().toLowerCase();
  const catsToShow = activeCategory === 'All' ? categories : [activeCategory];
  let shownCount = 0;
  let html = '';

  catsToShow.forEach(cat => {
    const filtered = HOOKS[cat].filter(h => h.toLowerCase().includes(term));
    if (filtered.length === 0) return;
    shownCount += filtered.length;
    html += `<div class="cat-section">
      <div class="cat-title"><h2>${cat}</h2><span class="n">${filtered.length} hooks</span></div>
      <div class="hook-grid">
        ${filtered.map(h => `
          <div class="hook-card" data-text="${escapeHtml(h).replace(/"/g,'&quot;')}">
            <span class="hook-text">${escapeHtml(h)}</span>
            <button class="copy-btn">Copy</button>
          </div>
        `).join('')}
      </div>
    </div>`;
  });

  if (shownCount === 0){
    html = `<div class="empty-state">No hooks match "${escapeHtml(searchTerm)}". Try a different word.</div>`;
  }

  vaultEl.innerHTML = html;
  countBadge.textContent = shownCount + ' hooks shown';

  vaultEl.querySelectorAll('.hook-card').forEach(card => {
    card.addEventListener('click', () => {
      const text = card.dataset.text.replace(/&quot;/g,'"');
      navigator.clipboard.writeText(text).then(() => {
        const btn = card.querySelector('.copy-btn');
        btn.textContent = 'Copied';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1200);
      });
    });
  });
}

searchEl.addEventListener('input', (e) => {
  searchTerm = e.target.value;
  render();
});

render();
</script>
