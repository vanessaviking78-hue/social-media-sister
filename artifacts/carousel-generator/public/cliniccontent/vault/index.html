<style>
  :root{
    --bg:#08080D; --bg-panel:#100f16; --card:#151319;

    --pink:#FF1493; --tan:#C4937F;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--cream);
    font-family:'League Spartan','Helvetica Neue',sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:10; background:rgba(8,8,13,0.92); backdrop-filter:blur(8px);
    display:flex;justify-content:space-between;align-items:center;
    padding:18px 24px;border-bottom:1px solid var(--border);
  }
  .logo{font-weight:800;font-size:18px;letter-spacing:-0.02em;}
  .logo span{color:var(--pink);}
  .count-badge{
    background:rgba(255,20,147,0.12);color:var(--pink);font-weight:700;
    padding:7px 16px;border-radius:100px;font-size:13px;
  }
  .intro{padding:50px 24px 30px;text-align:center;}
  .eyebrow{
    color:var(--tan);text-transform:uppercase;letter-spacing:0.14em;
    font-size:13px;font-weight:700;margin-bottom:16px;
  }
  h1{font-weight:800;font-size:40px;letter-spacing:-0.02em;margin-bottom:14px;}
  h1 .pink{color:var(--pink);}
  .sub{color:var(--cream-dim);font-size:16px;max-width:560px;margin:0 auto;font-weight:500;}

  .controls{
    max-width:1000px;margin:0 auto;padding:0 24px 30px;
    display:flex;flex-direction:column;gap:16px;
  }
  .search-box{
    width:100%;padding:14px 20px;border-radius:100px;border:1px solid var(--border);
    background:var(--card);color:var(--cream);font-family:inherit;font-size:15px;font-weight:500;
    outline:none;
  }
  .search-box::placeholder{color:var(--cream-faint);}
  .search-box:focus{border-color:var(--pink);}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .chip{
    padding:9px 18px;border-radius:100px;border:1px solid var(--border);
    background:var(--card);color:var(--cream-dim);font-family:inherit;font-size:13px;font-weight:700;
    cursor:pointer;transition:all .15s ease; white-space:nowrap;
  }
  .chip:hover{border-color:var(--pink);color:var(--cream);}
  .chip.active{background:var(--pink);color:#08080D;border-color:var(--pink);}

  .vault{max-width:1000px;margin:0 auto;padding:0 24px 100px;}
  .cat-section{margin-bottom:50px;}
  .cat-title{
    display:flex;align-items:center;gap:12px;margin-bottom:18px;
  }
  .cat-title h2{font-weight:800;font-size:22px;letter-spacing:-0.01em;}
  .cat-title .n{color:var(--tan);font-size:13px;font-weight:700;}
  .hook-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .hook-card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:18px 20px;font-size:14.5px;font-weight:500;color:var(--cream);
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    cursor:pointer; transition:border-color .15s ease;
  }
  .hook-card:hover{border-color:rgba(255,20,147,0.4);}
  .hook-text{flex:1;line-height:1.5;}
  .copy-btn{
    flex-shrink:0;width:30px;height:30px;border-radius:8px;background:rgba(255,20,147,0.1);
    color:var(--pink);display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;border:none;cursor:pointer;
  }
  .copy-btn.copied{background:var(--pink);color:#08080D;}
  .empty-state{
    text-align:center;padding:60px 24px;color:var(--cream-faint);font-size:15px;font-weight:500;
  }
  @media (max-width:720px){
    h1{font-size:28px;}
    .hook-grid{grid-template-columns:1fr;}
  }
</style>
</head>

en, it was steady, appointment after appointment.","Before: three years of \"someday.\" After: wishing someday had come sooner.","What actually shifted was her posture before anything else did.","The best before and afters are the ones where nobody else notices, but she does, every day.","Before: dreading her own reflection. After: barely registering the mirror at all, which was the whole point.","Not every result is visible in a single photo, some only show up in how someone answers a simple question.","The transformation that mattered most happened somewhere around the third appointment, quietly.","Before: hesitant, guarded, unsure. After: relaxed, open, glad she asked every question she had.","What changed wasn't just her face, it was how much space the worry used to take up.","The real shift: she stopped explaining herself for wanting this.","Before: nervous laughter in every consultation. After: genuine laughter, unprompted.","Not every after photo needs a dramatic before, sometimes steady and consistent is the whole story.","The change that mattered most: she finally believed the compliments instead of deflecting them.","Before: convinced this wasn't \"her kind of thing.\" After: recommending it to every friend who asks.","What actually shifted over these weeks was confidence, long before anything else caught up.","The best result isn't always visible, sometimes it's just relief, plain and simple.","Before: three consultations of hesitation. After: wondering why she waited so long to start.","Not every transformation is about change, some are just about finally feeling settled.","The real before and after: less time spent thinking about it, more time spent living.","Before: bracing for judgement. After: not expecting any, because there wasn't any to begin with.","What changed wasn't sudden or dramatic, it just quietly became normal.","The transformation that mattered most was internal, and it showed up in everything else eventually.","Before: avoiding the topic entirely. After: happy to talk about it whenever it comes up.","Not every result needs before and after side by side, some just need \"she seems lighter now.\"","The real shift happened in the waiting room, long before any treatment did.","Before: convinced she needed permission. After: realising she never did.","What actually changed was patience, hers and ours, working together.","The best before and after isn't dramatic, it's sustainable, and that's the whole point.","Before: unsure if this was worth the time. After: certain it was worth every appointment.","Not every transformation needs an audience, some just need to be true.","The change that stuck: she finally stopped comparing her progress to someone else's timeline.","Before: bracing herself before every photo. After: forgetting the camera was even there.","What shifted most wasn't visible at first, it took weeks to notice, and that's exactly how it should be.","The real before and after: fewer \"what ifs,\" more \"I'm glad I did.\"","Before: nervous energy in every appointment. After: genuinely looking forward to them.","Not every result is about looking different, sometimes it's about feeling like yourself again.","The transformation that mattered most: she finally stopped needing anyone else's approval.","The best after photo isn't the one with the biggest difference, it's the one where she's actually smiling.","The real difference wasn't the mirror, it was how often she checked it.","Before: three appointments of \"maybe.\" After: no maybes left.","What changed wasn't loud, it just finally felt permanent.","The transformation that mattered most happened in a conversation, not a treatment.","Before: convinced everyone would notice. After: nobody did, and that was exactly the plan.","Not every result needs a caption. Some just need a quiet nod in the mirror.","The best part of this journey wasn't the outcome, it was watching her stop bracing for judgement.","Before: checking every photo before posting. After: not checking at all.","What changed over these appointments wasn't dramatic, it was steady, and steady is what lasted.","The real result: she stopped explaining her face to people who never asked.","Before: rehearsing what she'd say if someone asked. After: not needing an answer ready anymore.","Not every transformation needs proof, some just need her own quiet certainty.","The change that stuck wasn't sudden, it built slowly, appointment by appointment.","Before: years of \"not yet.\" After: wondering what she was waiting for.","What actually shifted was how she talked about herself in front of other people.","The best before and afters are rarely the loudest ones in the room.","Before: nervous every single appointment. After: looking forward to them, genuinely.","Not every result shows up in a photo, some only show up in how she answers a question now.","The transformation that mattered most happened somewhere she wasn't expecting it to.","Before: hesitant, quiet, unsure. After: asking questions like she'd always known she could.","What changed wasn't just visible, it changed how long it took her to trust her own reflection.","The most honest before and after isn't the photo, it's the way she answers \"so how do you feel\" now.","Before: years of comparing. After: barely noticing anyone else's face at all.","Not every result needs an edit. Some of the best ones are the plainest photos we have.","The transformation nobody sees: someone finally exhaling in front of a mirror.","Before: checking constantly. After: forgetting to check at all.","What changed over these months wasn't obvious to anyone but her, and that was always the point.","The best part of this before and after isn't the change, it's the ease that came with it.","Same face, same everything, just less weight carried in it. That's a result too.","Before: dreading every photo. After: not thinking twice.","The transformation that matters most rarely fits into one single moment.","What you're seeing here took consistency, not perfection, and that's the honest version.","Before: hesitant, guarded, asking careful questions. After: confident, informed, glad she asked every one.","The real result isn't just visible, it's in how she talks about herself now, unprompted.","Same features, just carried differently. That's often the change nobody photographs.","Before: avoiding certain angles entirely. After: not thinking about angles at all.","What changed wasn't overnight, and that's exactly why it held.","The photo captures a single moment. It doesn't capture the patience that got her there.","Before: convinced it was too late to start. After: glad she never listened to that thought.","Not every transformation needs a side by side, sometimes it just needs \"she seems steadier now.\"","What actually changed over these appointments wasn't dramatic, it was consistent, and consistent lasts.","The result you can't see: she stopped rehearsing apologies for wanting this.","Before: unsure if this was \"allowed.\" After: certain it always was.","Same person, just carrying less weight around something that used to take up so much space.","The transformation that mattered most happened in the quiet, not the reveal.","What changed wasn't just her face, it was how rarely she thought about it now.","Before: apologising before she'd even asked her question. After: just asking it.","The best before and after isn't always about difference, sometimes it's about ease.","Before: three years of putting it off. After: wishing she'd known it could feel this simple.","The best after isn't the most dramatic one, it's the one where she looks the most like herself."],"Myth-Busting":["Myth: more experience always means better results. Truth: it means better judgement, which isn't always the same thing as more product.","Myth: natural results mean doing less. Truth: natural results are usually the hardest to achieve, not the laziest option.","Myth: younger practitioners are less skilled. Truth: skill comes from training and supervision, not just years in the chair.","Myth: a longer consultation means something's wrong. Truth: it usually means someone's actually being thorough.","Myth: if one clinic says yes and another says no, the one that says yes is more skilled. Truth: it's often the opposite.","Myth: results should look the same on everyone. Truth: the same approach on different faces gives completely different outcomes, on purpose.","Myth: cheaper always means the same quality, just a better price. Truth: price differences usually reflect training, products and safety standards.","Myth: patch tests are just a formality. Truth: they're one of the only ways to catch a reaction before it becomes a problem.","Myth: more reviews means more trustworthy. Truth: reviews say nothing about qualifications or safety record.","Myth: if it's popular online, it's probably safe. Truth: popularity and safety are two completely different things.","Myth: a clinic that treats you same day is being efficient. Truth: proper consultations often need more than one appointment.","Myth: the best practitioners never say no. Truth: the best ones say no more often than you'd think.","Myth: aftercare is optional if you're careful. Truth: it's not optional, it's part of the treatment.","Myth: results are instant. Truth: most results settle and develop over days or weeks, not minutes.","Myth: if a friend had a good result, you'll get the same one. Truth: every face responds differently.","Myth: qualifications don't matter as much as experience. Truth: both matter, and neither replaces the other.","Myth: a clinic with the most followers is the safest choice. Truth: social media presence has nothing to do with clinical training.","Myth: consultations are just a sales pitch. Truth: a proper one is where the actual clinical decisions happen.","Myth: skin only changes with age, not lifestyle. Truth: sleep, stress and hydration show up on your face constantly.","Myth: more products in your routine means better skin. Truth: consistency with fewer products often outperforms an overloaded routine.","Myth: if it worked quickly, it'll last. Truth: speed and longevity aren't related.","Myth: practitioners can tell exactly what you need just by looking. Truth: a proper assessment takes time, questions and often more than one visit.","Myth: everyone heals at the same rate. Truth: healing time varies hugely and has nothing to do with how \"well\" the treatment went.","Myth: if you're not told about risks, there aren't any. Truth: every treatment carries some risk, and you should always be told.","Myth: the newest technology is always the best option. Truth: newer isn't automatically better, it's just newer.","Myth: a good practitioner can treat any face the same way. Truth: good practitioners adapt their approach every single time.","Myth: if it's not painful, it's not working. Truth: comfort and effectiveness aren't connected.","Myth: once you start, you can't stop. Truth: you're always in control of your own treatment plan.","Myth: clinics that ask lots of questions are being difficult. Truth: they're being responsible.","Myth: subtle results mean the treatment \"didn't work.\" Truth: subtle is often exactly what was planned.","Myth: skincare doesn't matter if you're having treatments anyway. Truth: your skincare routine affects your results more than most people realise.","Myth: a clinic without a waiting list isn't in demand. Truth: it might just mean they don't overbook.","Myth: if it's trending, it must be tested and safe. Truth: trends move faster than research often does.","Myth: practitioners can undo any past treatment easily. Truth: some past treatments limit future options significantly.","Myth: consultations are the same everywhere. Truth: what's covered in a consultation varies hugely between clinics.","Myth: a clinic that talks about complications is trying to scare you. Truth: they're being transparent, which is what you want.","Myth: more frequent treatments give faster results. Truth: overdoing it can undo progress, not speed it up.","Myth: if you don't ask, there's nothing to worry about. Truth: not being told isn't the same as there being no risk.","Myth: everyone's timeline for results is the same. Truth: it varies person to person, and that's completely normal.","Myth: a busy clinic is automatically a good clinic. Truth: busy sometimes just means well marketed, not well practiced.","Myth: skincare brands endorsed by influencers are clinically tested the same way. Truth: endorsement and evidence are not the same thing.","Myth: you should feel dramatic results to know it worked. Truth: sometimes the absence of a problem is the actual result.","Myth: practitioners want you to keep coming back for more. Truth: good ones want you to need less over time, not more.","Myth: once you're informed, consent is just a formality. Truth: consent should be an ongoing conversation, not a one time signature.","Myth: a clinic that's been open longer is automatically more experienced. Truth: it depends entirely on who's actually treating you.","Myth: skin concerns are purely cosmetic. Truth: they're often deeply tied to confidence and how people show up in their own lives.","Myth: results should look identical to whoever inspired the treatment. Truth: your own features should always lead the decision, not someone else's.","Myth: if nobody notices, it didn't work. Truth: for a lot of patients, that's exactly the goal.","Myth: practitioners are trying to upsell you every time they explain more options. Truth: informed choice means explaining everything, not just what you asked about.","Myth: once you've had one treatment, you understand the whole industry. Truth: every treatment, practitioner and face is different, every single time.","Myth: a clinic should be able to treat you the same day you enquire. Truth: proper assessment takes time, and rushing it isn't a service, it's a risk.","Myth: more qualifications on a wall means better hands-on skill. Truth: ongoing supervised practice matters as much as the certificates.","Myth: if a treatment is popular, it must be right for most faces. Truth: popularity reflects marketing, not suitability.","Myth: a practitioner should always be able to give you an exact result guarantee. Truth: nobody ethical promises exact outcomes on a living, changing face.","Myth: skin issues are always about skincare products. Truth: sleep, diet, stress and genetics play a much bigger role than most people assume.","Myth: if a clinic doesn't offer financing, it's not accessible. Truth: transparent pricing without pressure is often the more responsible model.","Myth: practitioners should always agree with a patient's self-assessment. Truth: a professional opinion sometimes needs to gently challenge it.","Myth: the more treatments in one visit, the more efficient the appointment. Truth: efficiency should never come before appropriate pacing.","Myth: online consultations are just as thorough as in-person ones for every treatment. Truth: some assessments genuinely require hands-on evaluation.","Myth: a practitioner's own appearance reflects their skill. Truth: judging competence by a practitioner's own face is a flawed measure entirely.","Myth: skin never really changes once you're past a certain age. Truth: skin responds to care and consistency at any age.","Myth: complications are rare enough not to worry about. Truth: they're uncommon with skilled practitioners, but every patient deserves to know they're possible.","Myth: a clinic's social media following reflects its safety record. Truth: those two things have never been connected.","Myth: once you understand one treatment, you understand how they all work. Truth: mechanisms, risks and aftercare vary hugely between treatments.","Myth: a rushed consultation just means the practitioner is confident. Truth: confidence and thoroughness aren't opposites, the best practitioners have both.","Myth: aftercare only matters for the first 48 hours. Truth: some aftercare considerations matter for weeks afterward.","Myth: a practitioner should be able to answer every question instantly. Truth: \"let me check and get back to you properly\" is often the more honest answer.","Myth: a clinic's price list reflects the quality of care you'll receive. Truth: price reflects overheads, training and positioning, not automatically quality.","Myth: skin concerns are always visible to others the way they feel to you. Truth: most people notice far less than patients assume.","Myth: practitioners can always predict exactly how a face will respond. Truth: biology has genuine variability, and honest practitioners say so.","Myth: a clinic without visible before and afters has something to hide. Truth: some clinics prioritise patient privacy over promotional content.","Myth: the number of years in practice is the only measure of experience. Truth: the range and complexity of cases treated matters just as much.","Myth: patients should always know exactly what they want before booking. Truth: \"I'm not sure yet\" is a completely valid starting point.","Myth: a practitioner disagreeing with a trend is being old-fashioned. Truth: sometimes it's genuine clinical caution, not resistance to change.","Myth: skin always bounces back the same way it did in your twenties. Truth: skin's response to treatment and lifestyle changes with age, and that's normal.","Myth: a clinic's location or décor reflects the standard of care. Truth: neither has any bearing on clinical competence.","Myth: if you're not in pain, nothing's happening. Truth: comfort levels vary and have no bearing on whether a treatment is working.","Myth: practitioners should be able to work around any budget. Truth: sometimes the honest answer is that a smaller, appropriate plan is the better option.","Myth: skin concerns always have a single, simple cause. Truth: most concerns are multi-factorial, which is why treatment plans take time to build properly.","Myth: a clinic that turns away walk-ins isn't customer focused. Truth: proper triage and scheduling protects patients, not just the clinic's time.","Myth: once you've had a consultation, you don't need another one for future treatments. Truth: faces, health and goals change, so consultations should too.","Myth: practitioners should always know instantly what treatment you need. Truth: good practitioners ask before they assume, every time.","Myth: a clinic's reviews reflect clinical outcomes accurately. Truth: reviews often reflect experience and service, not clinical results specifically.","Myth: if something is legal, it's automatically safe in the wrong hands. Truth: legality and safe practice are not the same guarantee.","Myth: practitioners should be able to see you exactly when you want an appointment. Truth: a genuinely thorough clinic often has a wait, and that's not a flaw.","Myth: the newest practitioner in a clinic is automatically the least capable. Truth: supervision and training standards matter more than tenure alone.","Myth: skin only needs attention when something looks wrong. Truth: consistent care prevents concerns before they need correcting.","Myth: a practitioner should never say \"that's not something I can help with.\" Truth: knowing your own limits is a sign of genuine professionalism.","Myth: patients should trust marketing claims the same way they'd trust clinical evidence. Truth: the two should never be treated as equivalent.","Myth: a clinic offering every treatment under one roof is more convenient and therefore better. Truth: focused expertise sometimes outperforms broad offering.","Myth: once you've chosen a practitioner, you're locked into their opinion forever. Truth: seeking a second opinion is always a reasonable and welcome choice.","Myth: a clinic should never ask about your mental health before treating you. Truth: responsible practitioners are trained to consider wellbeing as part of suitability.","Myth: aftercare products are just an upsell. Truth: some genuinely support healing and results, and a good practitioner will explain which and why.","Myth: practitioners should be able to fix results from other clinics easily. Truth: correcting someone else's work is often more complex than starting fresh.","Myth: a clinic's confidence in a treatment means there's no risk involved. Truth: confidence in delivery doesn't remove inherent risk, it just means it's managed well.","Myth: patients who ask lots of questions are wasting the practitioner's time. Truth: those questions are exactly what a proper consultation is for.","Myth: a treatment plan should never change once it's been agreed. Truth: good practitioners adjust plans as circumstances and results develop.","Myth: skin concerns are always something to \"fix.\" Truth: sometimes the goal is simply maintenance and prevention, not correction.","Myth: practitioners should be able to work miracles with enough product. Truth: results always have biological and ethical limits, and honest practitioners respect them.","Myth: once you understand the theory, you understand the practice. Truth: hands-on supervised experience is what actually builds real skill.","Myth: a good practitioner should always have an immediate answer. Truth: \"let me think about that properly\" is often the most trustworthy response.","Myth: if it's not permanent, it's not worth doing. Truth: temporary and reversible options are often the safest way to start.","Myth: practitioners should be able to replicate any look you show them. Truth: your own anatomy always leads the decision, not a reference photo.","Myth: a clinic offering a loyalty scheme is prioritising sales over care. Truth: it can simply reflect an ongoing relationship, not pressure.","Myth: complications always happen because of practitioner error. Truth: some risk exists no matter how skilled the practitioner is, and honest ones say so.","Myth: if a treatment isn't painful, it's not doing anything. Truth: comfort and effectiveness are two completely separate things.","Myth: practitioners should agree to whatever a patient specifically requests. Truth: clinical judgement sometimes means recommending something different.","Myth: skin concerns always need active treatment. Truth: sometimes monitoring and patience is the genuinely correct plan.","Myth: a clinic's confidence in a plan means there's nothing to worry about. Truth: confidence and risk awareness can, and should, coexist.","Myth: practitioners with the most social media presence are the most in-demand for good reason. Truth: presence reflects marketing skill, not necessarily clinical skill.","Myth: once you've decided to proceed, backing out is awkward. Truth: any responsible clinic expects and respects that decision at any point.","Myth: skin should look the same in every lighting condition. Truth: lighting changes everything, and that's normal, not a flaw.","Myth: a practitioner who won't rush a decision is being difficult. Truth: they're protecting you from a decision you might regret.","Myth: more consultations before treatment means something's wrong. Truth: it usually just means the plan is being built properly.","Myth: patients should already understand medical terminology before booking. Truth: a good practitioner explains everything in plain language, every time.","Myth: a clinic's price should be the main factor in choosing where to go. Truth: qualifications, safety record and communication matter far more.","Myth: practitioners should always know your face better than you do. Truth: your own observations and feelings are a genuinely valid part of the plan.","Myth: skin concerns that started young will always need lifelong treatment. Truth: needs change, and plans should adapt with them.","Myth: a clinic offering payment plans is a red flag. Truth: it can simply reflect accessible, transparent pricing.","Myth: practitioners should never say \"I'd want a colleague's opinion on this.\" Truth: seeking a second opinion internally is a sign of good practice, not weakness.","Myth: results should look identical to what you saw in someone else's photo. Truth: your own face will always respond differently, and that's expected.","Myth: a nervous patient isn't ready for treatment. Truth: nerves and readiness aren't the same thing, and both deserve patience.","Myth: practitioners should be able to see everyone who wants an appointment quickly. Truth: proper assessment sometimes means a longer wait, and that's a good sign.","Myth: skin only needs help once a visible concern appears. Truth: preventative care is just as valid a reason to book a consultation.","Myth: a clinic that asks detailed questions about your motivations is being intrusive. Truth: understanding your \"why\" is a genuine part of responsible care.","Myth: practitioners should always be optimistic about outcomes. Truth: realistic, honest expectations serve patients far better than blind optimism.","Myth: a treatment plan should be finalised in the very first consultation. Truth: it often needs to evolve as more is understood.","Myth: skin concerns are less valid if they're \"just cosmetic.\" Truth: confidence and wellbeing are valid reasons on their own, always.","Myth: a practitioner disagreeing with your self-diagnosis is dismissive. Truth: it's often the beginning of getting the right plan, not the wrong one.","Myth: clinics should always have same-day availability to be considered good. Truth: thoroughness and appropriate wait times often go hand in hand.","Myth: once a plan is agreed, questioning it later is a hassle for the practitioner. Truth: an ongoing dialogue is exactly what good care looks like.","Myth: a practitioner should always match your enthusiasm about a treatment. Truth: measured, honest guidance matters more than shared excitement.","Myth: skin issues you've had for years can't really change now. Truth: consistent, appropriate care can make a genuine difference at any stage.","Myth: a clinic without an active waiting list isn't trustworthy. Truth: it might simply reflect efficient, well-managed scheduling.","Myth: practitioners should always defer to whatever's trending. Truth: clinical relevance matters more than popularity, every time.","Myth: asking about a practitioner's own treatments is inappropriate. Truth: it's a completely reasonable question, and most are happy to answer.","Myth: a treatment plan that changes halfway through means the first one was wrong. Truth: plans evolving with new information is a sign of good, responsive care.","Myth: skin concerns are purely about vanity. Truth: they're often deeply tied to how people show up and feel in their daily lives.","Myth: a practitioner should never ask you to wait before proceeding. Truth: sometimes waiting is the single most protective recommendation they can give.","Myth: clinics should be able to explain everything in one short appointment. Truth: some plans genuinely need more time and more than one conversation.","Myth: once you understand a treatment, the risk disappears. Truth: understanding manages risk, it doesn't remove it entirely.","Myth: a practitioner's calm manner means the situation is simple. Truth: calm and complex can absolutely coexist.","Myth: skin should respond the same way to the same treatment for everyone. Truth: individual variation is completely normal and expected.","Myth: a clinic that talks about their limits is undermining your confidence. Truth: it's one of the clearest signs you can trust them.","Myth: patients should already know exactly what outcome they want. Truth: \"help me figure out what's realistic\" is a completely valid starting point.","Myth: practitioners should always find a way to say yes. Truth: knowing when to say no protects you far more than an eager yes ever could.","Myth: a treatment plan without a strict timeline is disorganised. Truth: flexibility often reflects a plan built around you, not a template.","Myth: skin concerns that don't bother other people shouldn't bother you either. Truth: your own feelings about your own face are always valid, regardless of anyone else's opinion.","Myth: a clinic should always be able to match a competitor's price. Truth: pricing differences often reflect genuine differences in training, safety and care.","Myth: once you've had a consultation, the decision is basically made. Truth: a consultation is information gathering, not a commitment, ever."],"Objection-Handling":["\"I'm scared it'll look obvious.\" That's usually the first thing we talk about, and the easiest to plan around.","\"What if I don't like it?\" Most plans are designed to be adjusted, not permanent from the first appointment.","\"I don't know what I actually want.\" That's a completely normal place to start a consultation from.","\"Is it too late for me to start?\" There's rarely a wrong age to have this conversation.","\"I'm worried people will know.\" Subtle, well planned treatment is usually the opposite of obvious.","\"What if it hurts?\" Comfort is part of the plan, not an afterthought.","\"I don't want to look like someone else.\" Good consultations are built around your face, not a reference photo.","\"I've heard horror stories.\" That's exactly why qualifications and proper consultations matter so much.","\"What if my skin reacts badly?\" That's what patch testing and full medical history checks are there for.","\"I'm worried I'll regret it.\" A good practitioner will talk you through every option, including waiting.","\"I don't want anyone to notice.\" Most patients say that, and most leave looking like a well rested version of themselves, not a different person.","\"What if it doesn't work?\" A proper consultation sets realistic expectations before anything happens, not after.","\"I'm nervous about the needle.\" Most patients say the anticipation is worse than the actual appointment.","\"I don't want to feel judged.\" Consultations should feel like a conversation, never an assessment of your choices.","\"What if I can't afford to keep it up?\" A good plan works with your budget, not against it.","\"I've been putting this off for years.\" You're not behind, you're just ready now.","\"What if my partner or family disapproves?\" This is your decision, and a good clinic will always centre what you want.","\"I don't want to become 'that person' who keeps having treatments.\" Most patients want to look like themselves, just a little more at ease.","\"What if the results are permanent and I hate them?\" Most concerns in aesthetics are far more reversible or adjustable than people assume.","\"I'm worried about looking different at work.\" Subtlety is usually the entire point of a well planned treatment.","\"What if I ask a stupid question?\" There's no such thing in a consultation, that's genuinely what it's there for.","\"I don't know if I'm 'ready.'\" Booking a consultation doesn't commit you to anything, it just gets you information.","\"What if the practitioner talks me into something I don't want?\" A good one will talk you out of things just as often.","\"I'm scared of the recovery time.\" Every treatment is different, and that's covered clearly before you book anything.","\"What if people ask what I've had done?\" That's completely your choice to share or not, always.","\"I don't want to spend money on myself.\" This isn't indulgent, it's just another form of looking after yourself.","\"What if I look better in some photos than others afterwards?\" Lighting and angles affect everyone, treated or not.","\"I'm worried it'll become addictive.\" A responsible clinic will always tell you when enough is enough.","\"What if my skin is 'too far gone' to help?\" That phrase gets used a lot, and it's almost never true.","\"I don't want to be treated differently once I've had something done.\" You're the same person, just a bit more at ease in your own face.","\"What if I chicken out halfway through the consultation?\" That's completely fine, and it happens more than people think.","\"I'm scared it'll change how I look in a bad way.\" That fear is exactly why proper consultations exist.","\"What if I need multiple appointments and it gets expensive?\" That should always be explained clearly before you commit to anything.","\"I don't know how to explain what I want.\" Most patients don't, that's what the consultation conversation is for.","\"What if it's obvious I've had 'work done'?\" Most well planned treatment reads as \"well rested,\" not \"different.\"","\"I'm worried about being pressured into booking.\" A good clinic gives you time to think, every time.","\"What if my skin concerns are 'too minor' to bother with?\" If it bothers you, it's worth a conversation, full stop.","\"I don't want it to be the only thing people notice about me.\" That's usually a sign subtlety is the right approach for you.","\"What if I'm too anxious to go through with it?\" Nerves are normal, and a good practitioner will slow down for you.","\"What if I ask to stop halfway through?\" You're allowed to at any point, always.","\"I'm worried it'll hurt more than I can handle.\" Pain tolerance and options are always discussed beforehand, not assumed.","\"What if the results take longer than expected?\" Timelines vary, and that should be explained honestly upfront.","\"I don't want to feel 'high maintenance.'\" Looking after yourself isn't high maintenance, it's just self care.","\"What if I need to explain this to my kids one day?\" Most patients find that conversation far easier than they expected.","\"I'm scared of judgement from the practitioner.\" Good practitioners have heard every concern before, and none of it surprises them.","\"What if this becomes a slippery slope?\" A responsible clinic will always check in on that with you, not just book you in.","\"I don't want to lose my facial expressions.\" That's one of the most common questions in consultations, and a completely fair one to ask.","\"What if I feel silly for caring this much?\" You're allowed to care about how you feel in your own skin.","\"What if it's not 'me' anymore afterwards?\" The goal is usually to feel more like yourself, not less.","\"What if I ask and the answer is no?\" Then you'll have more information than you did before, and that's never wasted.","\"I don't want to feel obligated to keep going once I start.\" You're never locked into anything beyond a single appointment at a time.","\"What if I get emotional during the consultation?\" That happens more than you'd think, and it's never treated as anything other than completely normal.","\"I'm worried I'll be talked into more than I came in for.\" A good consultation ends with your decision, not a sales pitch.","\"What if I don't know how to describe what's bothering me?\" You don't need the right words, just a starting point, we'll build from there together.","\"I'm scared I'll be the oldest or youngest person to have ever asked about this.\" You genuinely won't be, and it wouldn't matter if you were.","\"What if I want a second opinion after this consultation?\" That's completely reasonable, and any good practitioner will support that decision.","\"I don't want to feel like just another appointment on the schedule.\" A proper consultation should never feel rushed, and if it does, that's worth trusting your instinct on.","\"What if I change my mind after booking?\" You're allowed to, right up until the moment treatment actually begins.","\"I'm worried about what my results will look like in ten years.\" That's a completely fair question, and a responsible practitioner will talk you through long-term considerations honestly.","\"What if I need to bring someone with me for support?\" Most clinics welcome that, and it's a completely normal thing to ask for.","\"I don't want to be remembered as 'difficult' for asking questions.\" Asking questions has never once made a patient difficult, it makes them informed.","\"What if the results don't match what I saw online?\" Honest practitioners will always explain how your face differs from a reference photo, and why that's actually a good thing.","\"I'm worried my skin is different to what practitioners usually see.\" Every practitioner has seen more variation than you'd expect, you won't surprise anyone.","\"What if I need longer to think it over than most people do?\" Take exactly as long as you need, there's no clock running on this decision.","\"I don't want to feel rushed into choosing a treatment today.\" A good consultation never requires a same-day decision.","\"What if my reasons for wanting this feel silly to explain?\" They won't sound silly, and even if they did, they're still valid reasons.","\"I'm worried about the cost of maintaining results long term.\" That should be part of the conversation from the very first appointment, not a surprise later.","\"What if I've read conflicting information online?\" Bring every question you have, that's exactly what the consultation is for.","\"I don't want my GP or family to find out unless I choose to tell them.\" That's entirely your choice, and no clinic should ever pressure you otherwise.","\"What if I'm not sure this is really 'me'?\" That uncertainty is worth exploring in the consultation itself, not a reason to avoid booking one.","\"I'm worried about how this might affect how people see me at work.\" Most patients find the change is subtle enough that this concern doesn't materialise the way they feared.","\"What if my skin doesn't respond the way other people's has?\" It might respond differently, and a good practitioner will track and adjust accordingly.","\"I don't want to feel like I'm chasing something that will never be enough.\" That's an important thing to raise, and a responsible practitioner will talk it through with you honestly.","\"What if I need to cancel last minute?\" Life happens, and a reasonable clinic will have a policy that accounts for that.","\"I'm scared of becoming someone who can't stop.\" A responsible clinic will always have that conversation with you directly, and check in over time.","\"What if I want to bring photos to explain what I mean?\" That's genuinely helpful, and most practitioners welcome visual references as a starting point for conversation.","\"I don't know if my concerns are 'big enough' to bring up.\" There's no threshold, if it's on your mind, it's worth discussing.","\"What if I feel differently about this in a year?\" That's completely possible, and most plans are built with future flexibility in mind.","\"I'm worried about judgement from other people in the waiting room.\" Most clinics manage privacy carefully, and nobody there is thinking about anyone but themselves anyway.","\"What if I need the appointment to run over because I have more questions than expected?\" A good clinic builds in time for exactly that.","\"I don't want this to become something I rely on to feel okay.\" That's an important thing to say out loud, and a good practitioner will take it seriously.","\"What if English isn't my first language and I struggle to explain things?\" A patient practitioner will slow down and work through it with you, however long that takes.","\"I'm worried I'll forget everything discussed in the consultation.\" Ask for it in writing, most clinics are happy to provide a summary.","\"What if my body reacts differently because of a health condition?\" That's exactly why full medical history is taken seriously before anything is agreed.","\"I don't want to feel like I have to justify wanting this.\" You don't, wanting to feel good in yourself is reason enough.","\"What if the consultation makes me more anxious, not less?\" Say so in the moment, a good practitioner will slow down or pause entirely.","\"I'm worried about the appointment being awkward if I decide not to go ahead.\" Deciding not to proceed is one of the most common, completely normal outcomes of a consultation.","\"What if I want to record the consultation to remember everything?\" Many clinics are happy to accommodate that, just ask.","\"I don't want to feel pressured by a discount or time-limited offer.\" A genuinely good decision doesn't need a countdown timer attached to it.","\"What if my skin concerns started after a specific event or period in my life?\" That context matters, and sharing it helps build a more accurate picture, not a judgement.","\"I'm scared the consultation itself will be the hardest part.\" For most people, it turns out to be the easiest and most reassuring part of the whole process.","\"What if I need accommodations because of a disability?\" A good clinic will ask what you need and adapt, rather than expecting you to fit their standard process.","\"I don't want to feel like I'm being sold to during the consultation.\" A consultation focused on your questions, not a sales script, should never feel that way.","\"What if I want to pause partway through a treatment course?\" You're always allowed to pause, adjust, or stop, at any stage.","\"I'm worried about my privacy if I pay by card or leave contact details.\" Ask directly how your data is handled, a transparent clinic will explain clearly.","\"What if I've been let down by a clinic before and I'm nervous to trust another one?\" That context is worth sharing, it helps a new practitioner understand what reassurance you need.","\"I don't want to feel like a number in a busy clinic.\" Ask how they manage continuity of care, a good answer will reassure you quickly.","\"What if I need extra time because I process information slowly?\" Say so, a good practitioner will adjust their pace without hesitation.","\"I'm scared that once I start, there's no going back to how I felt before.\" Feelings about your own face can shift in both directions, and that's worth discussing honestly before you begin.","\"What if I just need someone to tell me it's okay to wait?\" That's a completely valid outcome of a consultation too, and a good practitioner will say so if it's true.","\"I don't want my results to look like everyone else's on social media.\" A good practitioner builds a plan around your face specifically, not a trend.","\"What if I've left it too long to bother now?\" There's no expiry date on deciding to look after yourself.","\"I'm worried the consultation will feel like a sales pitch.\" A proper one is focused entirely on your questions, not a script.","\"What if I need to bring a list of questions written down?\" Bring the whole notebook, that's exactly what the appointment is for.","\"I don't want to seem vain for wanting this.\" Wanting to feel comfortable in your own face isn't vanity, it's completely reasonable.","\"What if my concerns change once I start the process?\" That's normal, and any good plan adjusts with you as you go.","\"I'm scared of being talked into something bigger than I wanted.\" A responsible practitioner will always start smaller and build from there, not the other way round.","\"What if I need reassurance more than information?\" Say so directly, that's a completely fair thing to ask for.","\"I don't want to feel like I'm on a conveyor belt.\" A proper consultation should never feel rushed through, and if it does, that's worth noticing.","\"What if I want to bring up something unrelated that's been on my mind?\" Bring it up, context always helps a practitioner understand the full picture.","\"I'm worried about looking 'done' rather than just well rested.\" That distinction is one of the most common conversations in a proper consultation.","\"What if I need more reassurance than most people seem to?\" That's completely fine, and a good practitioner will give you exactly as much as you need.","\"I don't want to be seen as high maintenance for asking detailed questions.\" Detail-oriented questions are a sign of a thoughtful patient, not a difficult one.","\"What if I want to slow the whole process down?\" You're always allowed to set the pace, always.","\"I'm worried that once I start, I won't know when to stop.\" That's an important conversation to have upfront, and a responsible practitioner will have it with you.","\"What if English isn't the language I think most clearly in?\" Bring someone to translate if that helps, or ask for extra time, either is completely fine.","\"I don't want to feel embarrassed about not knowing the terminology.\" Nobody expects you to, that's what the consultation is there to explain.","\"What if I need to process everything after the appointment before deciding?\" Take all the time you need, there's no pressure to decide on the day.","\"I'm worried the practitioner will think my concerns are trivial.\" No concern is trivial if it matters to you, full stop.","\"What if my face doesn't match what I imagined the result would look like?\" That's exactly why the consultation talks through realistic expectations before anything begins.","\"I don't want to feel like I need to know everything before I ask a question.\" You're allowed to ask basic questions, that's what a consultation is for.","\"What if my nerves make me forget what I wanted to ask?\" Write it down beforehand, and don't worry if you still forget something, you can always ask after.","\"I'm worried about being one of those people who keeps changing their mind.\" Changing your mind is a normal part of making an informed decision, not a flaw.","\"What if I want a completely different practitioner halfway through a plan?\" You're free to make that choice at any point, always.","\"I don't want to feel patronised if I ask something obvious.\" A good practitioner never makes a question feel small, whatever it is.","\"What if I need the appointment structured differently to usual?\" Ask for that, most clinics are happy to adapt where they can.","\"I'm scared that wanting this says something bad about how I feel about myself.\" Wanting to feel good in your own skin isn't a red flag, it's completely human.","\"What if I want proof of qualifications before booking?\" Any reputable practitioner will be glad to show you, ask without hesitation.","\"I don't want to feel judged for having tried something elsewhere first.\" Your history helps build the right plan, it's never held against you.","\"What if I need extra time to process bad news about my skin?\" A good practitioner will give you that space without rushing the conversation.","\"I'm worried about becoming reliant on treatments to feel normal.\" That's worth raising directly, and a responsible clinic will take it seriously.","\"What if I want a written summary of everything discussed?\" Ask for one, it's a completely reasonable request.","\"I don't want to feel dismissed if my concern seems minor to someone else.\" Your own perspective on your own face is what matters here, not anyone else's scale.","\"What if I need the practitioner to slow down their explanation?\" Just say so, there's no such thing as asking too many times.","\"I'm scared that once people notice, they'll only see the change.\" Most changes settle into how people see you as a whole, not as one isolated detail.","\"What if I want to bring a photo of my own face from years ago as a reference?\" That's often more useful than any other reference you could bring.","\"I don't want the appointment to feel transactional.\" A proper consultation is a conversation first, everything else follows from that.","\"What if I need to know the worst case scenario before I feel ready?\" Ask for it directly, a good practitioner will walk you through it honestly.","\"I'm worried about asking to see examples of less successful outcomes.\" That's a fair and useful question, and any honest practitioner will discuss it.","\"What if I want a plan that specifically avoids anything trending right now?\" That's a completely valid starting point for a consultation.","\"I don't want to feel rushed to decide between two options in the room.\" Ask to take both away and think it over, that's always allowed.","\"What if my biggest worry is what my parents or children would think?\" That's worth voicing, and it often shapes a much more comfortable plan.","\"I'm scared of regretting this in a way I can't undo.\" Ask specifically what is and isn't reversible, that clarity should always be part of the conversation.","\"What if I need to know exactly how much this will cost over a whole year?\" Ask for that full breakdown before committing to anything.","\"I don't want to feel like my age makes this a strange decision.\" There's no age where this stops being a reasonable thing to want.","\"What if I want the practitioner to explain what they'd genuinely recommend for their own face?\" That's a fair question, and most will answer honestly.","\"I'm worried about the practical logistics, like time off or travel.\" Ask about that upfront, it should be part of the planning from day one.","\"What if I need to know how this might interact with something I'm already managing?\" Always disclose that, it directly shapes what's safe and appropriate.","\"I don't want to feel like just a number on someone's monthly target.\" Ask how they think about pacing and patient numbers, the answer tells you a lot.","\"What if the biggest barrier isn't the treatment, it's just finally deciding?\" That's the most common barrier there is, and simply booking the consultation is usually the hardest part done."]};

const categories = Object.keys(HOOKS);
const chipsEl = document.getElementById('chips');
const vaultEl = document.getElementById('vault');
const searchEl = document.getElementById('searchBox');
const countBadge = document.getElementById('countBadge');

let activeCategory = 'All';
let searchTerm = '';

function totalCount(){
  return Object.values(HOOKS).reduce((sum, arr) => sum + arr.length, 0);
}

function renderChips(){
  const allChip = `<button class="chip ${activeCategory==='All' ? 'active':''}" data-cat="All">All (${totalCount()})</button>`;
  const catChips = categories.map(cat =>
    `<button class="chip ${activeCategory===cat ? 'active':''}" data-cat="${cat}">${cat} (${HOOKS[cat].length})</button>`
  ).join('');
  chipsEl.innerHTML = allChip + catChips;
  chipsEl.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCategory = btn.dataset.cat;
      render();
    });
  });
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render(){
  renderChips();
  const term = searchTerm.trim().toLowerCase();
  const catsToShow = activeCategory === 'All' ? categories : [activeCategory];
  let shownCount = 0;
  let html = '';

  catsToShow.forEach(cat => {
    const filtered = HOOKS[cat].filter(h => h.toLowerCase().includes(term));
    if (filtered.length === 0) return;
    shownCount += filtered.length;
    html += `<div class="cat-section">
      <div class="cat-title"><h2>${cat}</h2><span class="n">${filtered.length} hooks</span></div>
      <div class="hook-grid">
        ${filtered.map(h => `
          <div class="hook-card" data-text="${escapeHtml(h).replace(/"/g,'&quot;')}">
            <span class="hook-text">${escapeHtml(h)}</span>
            <button class="copy-btn">Copy</button>
          </div>
        `).join('')}
      </div>
    </div>`;
  });

  if (shownCount === 0){
    html = `<div class="empty-state">No hooks match "${escapeHtml(searchTerm)}". Try a different word.</div>`;
  }

  vaultEl.innerHTML = html;
  countBadge.textContent = shownCount + ' hooks shown';

  vaultEl.querySelectorAll('.hook-card').forEach(card => {
    card.addEventListener('click', () => {
      const text = card.dataset.text.replace(/&quot;/g,'"');
      navigator.clipboard.writeText(text).then(() => {
        const btn = card.querySelector('.copy-btn');
        btn.textContent = 'Copied';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1200);
      });
    });
  });
}

searchEl.addEventListener('input', (e) => {
  searchTerm = e.target.value;
  render();
});

render();
</script>
