<style>

  .logo{font-weight:800;font-size:18px;letter-spacing:-0.02em;}
  .logo span{color:var(--pink);}
  .back-link{

  .back-link:hover{color:var(--pink);}

  .intro{padding:50px 24px 30px;text-align:center;}
  .eyebrow{

  }
  h1{font-weight:800;font-size:38px;letter-spacing:-0.02em;margin-bottom:14px;}

  .sub{color:var(--cream-dim);font-size:16px;max-width:600px;margin:0 auto;font-weight:500;}

  .search-wrap{max-width:700px;margin:0 auto;padding:0 24px 30px;}

  .category-btn.active{background:var(--pink);color:#08080D;border-color:var(--pink);}

  .sub-nav{

    display:flex;gap:8px;justify-content:center;flex-wrap:wrap;

  .sub-btn{

  .sub-btn.active{background:var(--pink);color:#08080D;border-color:var(--pink);}

  .sub-panel{display:none;}
  .sub-panel.active{display:block;}

  .panel-intro{
    background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:28px 32px;margin-bottom:24px;
  }
  .panel-intro h2{font-weight:800;font-size:24px;margin-bottom:10px;}
  .panel-intro p{color:var(--cream-dim);font-size:15px;font-weight:500;}

  .idea-card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:18px 20px;margin-bottom:12px;
    display:flex;justify-content:space-between;align-items:flex-start;gap:16px;

  .idea-text{flex:1;color:var(--cream);font-size:15px;font-weight:500;line-height:1.5;}
  .copy-btn{

  }
  .topic-text{color:var(--cream);font-size:15px;font-weight:700;line-height:1.5;margin-bottom:14px;}

  .empty-state{

  @media (max-width:640px){
    h1{font-size:28px;}
    .panel-intro{padding:22px;}
    .idea-card{flex-direction:column;align-items:stretch;}
    .hook-row{flex-direction:column;align-items:stretch;}
  }
</style>

const CATEGORIES = [
  { id: "months", label: "Months", type: "grouped", groups: MONTHS },
  { id: "treatments", label: "Treatments", type: "grouped", groups: TREATMENTS },
  { id: "about-me", label: "About Me", type: "flat", data: ABOUT_ME },
  { id: "volume-loss", label: "Volume Loss", type: "flat", data: VOLUME_LOSS },
  { id: "menopause", label: "Menopause", type: "flat", data: MENOPAUSE }
];

const categoryNav = document.getElementById('categoryNav');
const subNav = document.getElementById('subNav');
const mainContent = document.getElementById('mainContent');
const searchBox = document.getElementById('searchBox');

categoryNav.innerHTML = CATEGORIES.map((c, i) =>
  `<button class="category-btn${i===0?' active':''}" data-category="${c.id}">${c.label}</button>`
).join('');

// Renders a plain idea (string) as a simple copy card
function renderIdea(idea){
  return `
    <li class="idea-card">
      <span class="idea-text">${idea}</span>
      <button class="copy-btn" data-text="${idea.replace(/"/g,'&quot;')}">Copy</button>
    </li>
  `;
}

// Renders a topic+hooks object as a richer card with 3 hook rows
function renderTopic(item){
  const hooksHtml = item.hooks.map(h => `
    <li class="hook-row">
      <span class="hook-text">${h}</span>
      <button class="copy-btn" data-text="${h.replace(/"/g,'&quot;')}">Copy</button>
    </li>
  `).join('');
  return `
    <div class="topic-card">
      <div class="topic-text">${item.topic}</div>
      <ul class="hooks-list">${hooksHtml}</ul>
    </div>
  `;
}

// Decide which renderer a data block needs, based on whether it has "items" (topic+hooks) or "ideas" (flat strings)
function renderBlock(block){
  if(block.items){
    return block.items.map(renderTopic).join('');
  }
  return `<ul class="idea-list">${block.ideas.map(renderIdea).join('')}</ul>`;
}

function attachCopyHandlers(scope){
  scope.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const text = btn.dataset.text.replace(/&quot;/g, '"');
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = 'Copied';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1200);
      });
    });
  });
}

function renderCategory(categoryId){
  searchBox.value = '';
  const category = CATEGORIES.find(c => c.id === categoryId);
  categoryNav.querySelectorAll('.category-btn').forEach(b => b.classList.toggle('active', b.dataset.category === categoryId));

  if(category.type === 'grouped'){
    subNav.style.display = 'flex';
    subNav.innerHTML = category.groups.map((g, i) =>
      `<button class="sub-btn${i===0?' active':''}" data-group="${g.id}">${g.label}</button>`
    ).join('');
    mainContent.innerHTML = category.groups.map((g, i) => `
      <div class="sub-panel${i===0?' active':''}" id="group-${g.id}">
        <div class="panel-intro">
          <h2>${g.label}</h2>
          <p>${g.intro}</p>
        </div>
        ${renderBlock(g)}
      </div>
    `).join('');
    subNav.querySelectorAll('.sub-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        subNav.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mainContent.querySelectorAll('.sub-panel').forEach(p => p.classList.remove('active'));
        document.getElementById('group-' + btn.dataset.group).classList.add('active');
        window.scrollTo({top: mainContent.offsetTop - 20, behavior: 'smooth'});
      });
    });
  } else {
    subNav.style.display = 'none';
    mainContent.innerHTML = `
      <div class="sub-panel active">
        <div class="panel-intro">
          <h2>${category.data.label}</h2>
          <p>${category.data.intro}</p>
        </div>
        ${renderBlock(category.data)}
      </div>
    `;
  }
  attachCopyHandlers(mainContent);
}

categoryNav.querySelectorAll('.category-btn').forEach(btn => {
  btn.addEventListener('click', () => renderCategory(btn.dataset.category));
});

renderCategory('months');

searchBox.addEventListener('input', () => {
  const term = searchBox.value.trim().toLowerCase();
  if(!term){
    renderCategory(categoryNav.querySelector('.category-btn.active').dataset.category);
    return;
  }
  categoryNav.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
  subNav.style.display = 'none';

  const topicMatches = [];
  const ideaMatches = [];
  CATEGORIES.forEach(c => {
    const blocks = c.type === 'grouped' ? c.groups : [c.data];
    blocks.forEach(b => {
      if(b.items){
        b.items.forEach(item => {
          if(item.topic.toLowerCase().includes(term) || item.hooks.some(h => h.toLowerCase().includes(term))) topicMatches.push(item);
        });
      } else {
        b.ideas.forEach(idea => { if(idea.toLowerCase().includes(term)) ideaMatches.push(idea); });
      }
    });
  });

  const html = topicMatches.map(renderTopic).join('') + (ideaMatches.length ? `<ul class="idea-list">${ideaMatches.map(renderIdea).join('')}</ul>` : '');
  mainContent.innerHTML = (topicMatches.length || ideaMatches.length)
    ? html
    : `<div class="empty-state">No ideas match "${searchBox.value}". Try a different word.</div>`;
  attachCopyHandlers(mainContent);
});
</script>
