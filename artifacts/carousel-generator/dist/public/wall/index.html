<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wall of Love | The Cyber Suite</title>
<meta name="description" content="What clients say about working with Vanessa Wormald.">
<style>
  :root{--pink:#ff2e93;--muted:#c7c0c5;--line:#3b2431}
  *{box-sizing:border-box}
  body{margin:0;background:#000;color:#fff;font-family:"Helvetica Neue",Arial,system-ui,sans-serif;line-height:1.55}
  .wrap{max-width:1000px;margin:0 auto;padding:40px 16px 80px}
  .tag{display:inline-block;background:var(--pink);color:#000;padding:4px 12px;border-radius:99px;font:700 .8rem/1.4 system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase}
  h1{font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.05;margin:12px 0;font-weight:900;letter-spacing:-.02em}
  h1 em{color:var(--pink);font-style:normal}
  .lede{color:var(--muted);font-size:1.1rem;margin:0 0 28px;max-width:640px}
  .summary{display:flex;align-items:center;gap:16px;margin:0 0 32px;flex-wrap:wrap}
  .big{font-size:3rem;font-weight:900;color:var(--pink);line-height:1}
  .stars{color:var(--pink);font-size:1.5rem;letter-spacing:2px}
  .off{color:#3a3a3a}
  .count{color:var(--muted);font-size:.95rem}
  .grid{columns:2 320px;column-gap:16px}
  .card{break-inside:avoid;background:#0f0f0f;border:1px solid var(--line);border-radius:16px;padding:22px;margin:0 0 16px}
  .card .stars{font-size:1.15rem}
  .quote{font-style:italic;font-family:Georgia,serif;font-size:1.05rem;margin:12px 0;white-space:pre-wrap;border-left:3px solid var(--pink);padding-left:12px}
  .who{font-weight:800}
  .clinic{color:var(--muted);font-size:.9rem}
  .empty{color:var(--muted);text-align:center;padding:60px 0}
  .cta{display:inline-block;margin-top:24px;background:var(--pink);color:#000;font:700 1rem system-ui,sans-serif;padding:14px 28px;border-radius:99px;text-decoration:none}
  .cta:hover{background:#fff}
</style>
</head>
<body>
<div class="wrap">
  <span class="tag">Wall of love</span>
  <h1>Kind words from <em>brilliant clinics.</em></h1>
  <p class="lede">Real reviews, written by the clinic owners I work with. I did not write a single one of them, although I did cry at a few.</p>
  <div class="summary" id="summary" hidden>
    <div class="big" id="avg"></div>
    <div><div class="stars" id="avgstars"></div><div class="count" id="cnt"></div></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Reviews are on their way. Check back soon.</div>
  <a class="cta" href="/reviews">Leave me a review</a>
</div>
<script>
(function(){
  function stars(n){ var r=Math.round(n),s=""; for(var i=1;i<=5;i++){ s+='<span class="'+(i<=r?"":"off")+'">★</span>'; } return s; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  fetch("/api/client-reviews/public").then(function(r){return r.json();}).then(function(d){
    var list=(d&&d.reviews)||[];
    if(!list.length){ document.getElementById("empty").hidden=false; return; }
    var sum=0; list.forEach(function(r){ sum+=Number(r.average); });
    var avg=sum/list.length;
    document.getElementById("avg").textContent=avg.toFixed(1);
    document.getElementById("avgstars").innerHTML=stars(avg);
    document.getElementById("cnt").textContent="from "+list.length+" review"+(list.length===1?"":"s");
    document.getElementById("summary").hidden=false;
    document.getElementById("grid").innerHTML=list.map(function(r){
      return '<div class="card"><div class="stars">'+stars(r.average)+'</div>'+
        '<div class="quote">“'+esc(r.heart)+'”</div>'+
        '<div class="who">'+esc(r.name)+'</div>'+
        (r.clinic?'<div class="clinic">'+esc(r.clinic)+'</div>':'')+'</div>';
    }).join("");
  }).catch(function(){ document.getElementById("empty").hidden=false; });
})();
</script>
</body>
</html>
